[build-system]
# we require a setuptools version with PEP 639 support
requires = [
    "setuptools>=80.0.0",
    "wheel",
    "setuptools_scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "interpretune"
dynamic = ["version"]
authors = [{name = "Daniel Dale", email = "danny.dale@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE*"]
requires-python = ">=3.10"
keywords = ["llm", "reasoning", "interpretability", "fine-tuning", "finetuning"]
classifiers = [
            "Environment :: Console",
            "Natural Language :: English",
            "Development Status :: 5 - Production/Stable",
            "Intended Audience :: Developers",
            "Topic :: Scientific/Engineering :: Artificial Intelligence",
            "Topic :: Scientific/Engineering :: Image Recognition",
            "Topic :: Scientific/Engineering :: Information Analysis",
            "Operating System :: OS Independent",
            "Programming Language :: Python :: 3",
            "Programming Language :: Python :: 3.10",
            "Programming Language :: Python :: 3.11",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: 3.13",
]
description = "A package to support LLM reasoning and interpretability experiments at a level of abstraction that is both powerfully flexible and convenient"
readme = "README.md"
dependencies = [
    "torch >=2.7.1",
    "transformers>=4.57.1",
    "tabulate >= 0.9.0",
    "datasets >= 4.0.0",
    # Ceiling is MEASURED, not inherited: `ArgumentParser.instantiate_classes` (which `ITCLI` and the Lightning
    # adapter both call) is deprecated from 4.49.0 and emits a JsonargparseDeprecationWarning that our own
    # `unexpected_warns` assertions treat as a failure. Its replacement, `instantiate`, does not exist below
    # 4.49.0, so spanning both needs the migration tracked in #278 before this can move to <5.0. The previous
    # <4.42.0 cap cited an unverified "regression w/ 4.42"; 4.42.0 is in fact clean (89 CLI-surface tests and
    # 15/15 shipped configs), and nothing in the dependency graph ever asked for that bound.
    # FLOOR >=4.49.0: `ArgumentParser.instantiate_classes` was deprecated in 4.49.0 (removed in 5.0.0)
    # and its replacement `instantiate` does not exist below 4.49.0, so the two cannot both be satisfied.
    # Deliberately drops 4.35-4.48: pre-MVP, and a commonly used interface is being deprecated, so we take
    # the cleaner end state over the wider window (#278).
    # CEILING <5.0 IS GATED ON LIGHTNING, NOT ON US. lightning <= 2.6.5 itself calls TWO jsonargparse
    # APIs that 5.0.0 REMOVES -- those are breaks, not warnings:
    #   1. `ArgumentParser.instantiate_classes`, from `LightningCLI.instantiate_classes` (cli.py:612)
    #   2. `skip_none=`, from `SaveConfigCallback`'s parser.save/dump          (cli.py:291, 307, 590)
    #   3. `ArgumentParser.add_instantiator`, from `_add_instantiators`             (cli.py:596, 601)
    # `LightningArgumentParser` overrides none of them, so all resolve to jsonargparse's deprecated
    # implementations. Our own call site already uses `instantiate`, so interpretune's code being clean
    # does NOT permit this ceiling to move. Moving past `<5.0` requires a Lightning release that migrates
    # all three -- a routine Lightning bump is the unblocking event, which nobody would connect to a
    # jsonargparse ceiling without this note. Verified against lightning 2.6.5 (latest) on 2026-08-19.
    "jsonargparse[signatures] >= 4.49.0,<5.0",
    # "finetuning-scheduler[possible_future_it_plugin] >= 2.5.0",
]

[project.urls]
"Homepage" = "https://github.com/speediedan/interpretune"
"Bug Tracker" = "https://github.com/speediedan/interpretune/issues"
"Documentation" = "https://interpretune.org/en/latest/"
"Source Code" = "https://github.com/speediedan/interpretune"

[project.entry-points."console_scripts"]
interpretune = "interpretune.base.components.cli:bootstrap_cli"

[project.entry-points."finetuning_scheduler.strategy_adapters"]
transformerbridge = "interpretune.adapters.transformer_lens:TransformerBridgeStrategyAdapter"

[project.optional-dependencies]

lightning = [
    # 2.13.0 published 2026-07-26; interpretune had been pinning its release candidate by git SHA
    # (c378e55) while it was unpublished. The consumed surface — StrategyAdapter,
    # ScheduleImplMixin.save_schedule and the `finetuning_scheduler.strategy_adapters` entry point —
    # is identical between that SHA and the release, so this is a pin-form change, not a version bump.
    "finetuning-scheduler >= 2.13.0",
    "bitsandbytes; platform_system != 'Darwin'",
    "peft>=0.18",
]

examples = [
    "wandb",
    "torch-tb-profiler",
    "notebook",
    "jupyterlab",
    "ipywidgets",
    "jupytext >= 1.10",  # converting notebook source .py to .ipynb
    "nbval >= 0.9.6",  # testing the notebook
    "python-dotenv",
    "plotly",
    "matplotlib",
    "gdown",
    "evaluate",
    "scikit-learn",
    "neuronpedia",
    "pgpq >=0.11,<0.12",  # binary Arrow COPY encoder for the columnar local-DB import lane
    "syrupy >= 4.6",  # snapshot testing consumed by the SAEDashboard/SAELens suites run from this env
    # v3 adds the TransformerBridge architecture. 3.5.1 is the release cut from the commit this project
    # previously pinned by git URL (tag v3.5.1 == 4ba2187b), so this is a release-pin of identical code.
    # sae-dashboard caps transformer-lens below 3.x (`^2.2.0`, i.e. <3.0.0), hence the matching entry
    # in [tool.uv] override-dependencies / requirements/ci/overrides.txt. sae-lens does NOT cap it --
    # its `>=2.16.1` is a FLOOR, which 3.5.1 satisfies. (Corrected 2026-08-09; the comment previously
    # listed sae-lens as a capping downstream, which would have made the override look load-bearing
    # for a constraint that does not exist.)
    "transformer-lens >=3.5.1,<4",
    # Released floor since 2026-08-09: SAELens#721 merged (`3495640`) and shipped in 6.49.0, so the
    # Scalable Dashboards fork pin is retired. 6.49.0 is the FIRST release carrying the
    # `ActivationsStore.get_batch_tokens(move_to_model_device=...)` seam SAEDashboard's columnar
    # runner uses; SAEDashboard probes for it and degrades gracefully, so this is a floor for the
    # optimization rather than for correctness.
    #
    # NOTE the released alias set is deliberately NARROWER than the fork's: the maintainer verified
    # every `neuronpedia:` entry against production neuronpedia.org and dropped all 52 gemma-3-1b-it
    # aliases, which pointed at pages that do not exist. Nothing here depended on them resolving --
    # they 404'd under the fork too.
    "sae_lens >= 6.49.0",
    # we comment these out when installing from git urls to avoid dep conflicts
    # note packages that have need to have git url deps override transitive dependencies (e.g. needing to override
    # sae-lens' transformer-lens dependency with a git url dep) need to be moved to git-deps as well
    # "circuit-tracer>=0.1.0",
    # "nnsight >= 0.5.15",
]

[dependency-groups]
# PEP 735 dependency groups for development and CI

# Git URL dependencies - packages installed from git repositories
# These are separated because they cannot be included in universal lock files
# Update commit hashes when cutting release branches to pin to tested versions
# Keep this list as SHORT as possible: every entry here is a package we cannot pin to a release, so
# it is excluded from the universal lock file and has to be re-validated by hand. Prefer a released
# version floor in `examples`/`lightning` the moment upstream publishes one.
git-deps = [
    # circuit-tracer: no release carries the attribution-target surface interpretune uses. The pin
    # MUST include d117ba1 ("Canonicalize nnsight trace inputs via tokenized tensors") -- before it,
    # a raw `str` prompt was re-tokenized with add_special_tokens=True, double-prefixing an explicit
    # BOS and silently shifting every position index in the feature-intervention path.
    "circuit-tracer @ git+https://github.com/speediedan/circuit-tracer.git@3fde7e203f3a73da28d24ce2d1f173f92eaf5480",
    # sae-lens RETIRED from git-deps 2026-08-09 -- SAELens#721 merged and released as 6.49.0, so it
    # is now a released floor in `dependencies` above. This is the wave's first git-dep to go.
    #
    # The retired pin (`speediedan/SAELens@86f90b3d`) must NOT be resurrected: it carries 20 duplicate
    # YAML keys in `pretrained_saes.yaml` (10 x `path`, 10 x `l0`) from a bad rebase, which silently
    # bound 10 entries in `gemma-scope-2-1b-pt-` / `-12b-pt-transcoders-all` to the WRONG weights.
    # Upstream main never had them and the maintainer fixed them before merging. Only `-pt-` releases
    # were affected and everything here uses `gemma-scope-2-1b-it-transcoders-all`, so nothing we
    # generated was wrong -- but the pin itself is unsafe.
    #
    # sae-dashboard stays pinned: its PR (SD#74) is still open, and
    # interpretune.utils.neuronpedia_dashboard_pipeline imports fork-only surface
    # (e.g. sae_dashboard.neuronpedia.prompt_bucketing). Flip it to a released floor at merge.
    # The SD#74 head carrying `columnar_parquet_row_group_size` and `columnar_write_page_index`. Both are hard FLOORS
    # rather than runtime-probed capabilities: interpretune emits --columnar-write-page-index unconditionally, so an
    # older SAEDashboard fails with "unrecognized arguments" rather than silently producing an unindexed
    # corpus. Neither a page index nor row-group boundaries can be added after generation, so that
    # trade -- loud failure over silent degradation -- is the only safe one. Pre-MVP, so requiring a
    # floor is cheaper than carrying a compatibility gate.
    #
    # The row-group default is what actually makes an artifact streamable: readers prune per ROW
    # GROUP, so the previous one-row-group files cost a reader the WHOLE file to fetch one feature
    # and the page index did not change that. Generation commands are unchanged (the default is on),
    # but corpora generated before this pin have to be regenerated to benefit.
    "sae-dashboard @ git+https://github.com/speediedan/SAEDashboard.git@823ae3b61c0c33d7cf40e68d043a4dfe3375342d",
]

dev = [
    # Core development tools
    "uv >= 0.5.0",
    "pre-commit >= 1.0",
    "pyright >= 1.1.365",
    "toml",
]

test = [
    { include-group = "dev" },
    # Testing framework and tools
    "coverage >= 6.4",
    "pytest >= 6.0",
    "pytest-cov >= 6.0.0",
    "pytest-rerunfailures >= 10.2",
    # Additional test dependencies
    "twine >= 3.2",
    "psycopg",
    # >=1.9.0 is the first release whose own `hf_xet` extra floors hf-xet at 1.4.3, which is where
    # xet-core#764 landed: before it, a bucket sync wrote into an existing local file WITHOUT
    # truncating, so re-syncing a corpus whose files SHRANK left the previous tail in place. Parquet
    # reads its footer from the end, so the result still began and ended with `PAR1` and failed to
    # open. See huggingface_hub#3995. Floored here rather than on hf-xet directly so the platform
    # markers (x86_64/arm64 only) stay hub's to maintain.
    "huggingface_hub[hf_xet] >= 1.9.0",
    # Notebook testing
    "nbmake >= 1.5.0",
    "papermill >= 2.4.0",
    # sae_dashboard moved to git-deps (fork-pinned) until the upstream SD PR merges
]

docs = [
    # Documentation generation (keep in sync with requirements/docs.txt — RTD/CI source of truth).
    # Modernized 2026-07-21: dropped the legacy pt_lightning_sphinx_theme git dep, its jinja2<3.1
    # cap, and the deprecated sphinxcontrib-fulltoc/mockautodoc packages.
    "sphinx >= 8.1,<9.0",
    "pydata-sphinx-theme >= 0.16.1",
    "myst-nb >= 1.2.0",  # supersedes myst-parser; renders example notebooks with execution off
    "linkify-it-py >= 2.0",
    "sphinx-copybutton >= 0.5",
    "sphinx-autodoc-typehints >= 3.0",
]

profiling = [
    # Performance profiling tools
    "py-spy",
]


[tool.uv]
# mechanism to override specific dependency version for a package, we use the CLI --override overrides.txt
# version in order to allow the same directives to be used while simultaneously installing multiple packages from source
# e.g. have the same overrides for transformer-lens apply to interpretune and circuit-tracer installations
# from source we also include this version to ensure it is respected when installing without the
# --override flag (e.g CI)
override-dependencies = [
    # force the v3 line over sae-dashboard's cap (`^2.2.0`, i.e. <3.0.0). sae-lens' `>=2.16.1` is a
    # FLOOR, not a cap, and needs no override. 3.5.1 is the release of the commit formerly pinned here
    # by git URL (tag v3.5.1 == 4ba2187b), so this is the same code with a real version string
    # instead of `0.0.0`.
    "transformer-lens==3.5.1",
    # keep transitive nnsight (pulled in by sae-lens) at the validated release
    # (0.7.0 validated: nnsight slice + parity 34/0 + low-RAM mock, both versions)
    "nnsight==0.7.0",
]
# exclude dependencies ignore a dependency altogether (transitive or direct); we also use an excludes
# FILE (requirements/ci/excludes.txt) for the from-source installs, which uv reads via UV_EXCLUDE.
# torchaudio: pulled in transitively by sae-dashboard's `decode-clt` dependency but imported NOWHERE
# in this project (nor in sae_dashboard itself). It is not merely dead weight — no torchaudio release
# is paired with the pinned torch (latest is 2.11.0 against torch 2.13), so letting it resolve drags a
# second, mismatched CUDA runtime stack into the env and breaks `import torch`
# (libtorch_cuda.so: undefined symbol: ncclCommResume).
exclude-dependencies = ["torchaudio"]

# [tool.uv.pip]
# mechanism to override metadata in dev version of (e.g., transformer_lens will be 0.0.0 via git url or source install)
# can also be enabled at command line with env variable but not usually required for most contexts where you already
# have an associated override-dependency set
# export UV_PIP_DEPENDENCY_METADATA='[{"name":"transformer-lens","version":"3.0.0"}]'
# or here in pyproject.toml
# dependency-metadata = [
#   { name = "transformer-lens", version = "3.0.0" }
# ]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
# example/notebook tests are repo-only: they may import test helpers (tests.runif) and must not ship
exclude = ["it_examples.tests*"]

[tool.setuptools.package-data]
# registry/** must ship: the example registry hydrates from these component trees at runtime
# (MANIFEST.in's recursive-include also covers them today; this glob is the belt to that braces)
"it_examples" = ["*.yaml", "examples/**/*.yaml"]
"interpretune" = ["*.yaml"]
# bundled op-family definitions must ship in the wheel (belt to MANIFEST.in's recursive-include)
"interpretune.analysis.ops.bundled" = ["*.yaml"]
"interpretune.analysis.ops.bundled.core" = ["*.yaml"]
"interpretune.analysis.ops.bundled.sae" = ["*.yaml"]
"interpretune.analysis.ops.bundled.attribution" = ["*.yaml"]
"interpretune.analysis.ops.bundled.concept" = ["*.yaml"]
"interpretune.analysis.ops.bundled.circuit_tracer" = ["*.yaml"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"
# Only `v`-prefixed release tags are version tags. Without this, any tag reachable from HEAD that
# ends in digits — e.g. the dashboards evidence tag `scalable-dashboards-wave1-evidence-20260812`,
# cut on a main commit — parses as a calendar version (`20260812`), which then satisfies floors
# like `>=999.0` and broke the hub-component floor test on the first main build after the tag push
# (build 753; hosted CI was blind to it because actions/checkout does not fetch tags).
tag_regex = '^v(?P<version>\d.*)$'
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.ruff]
line-length = 120
# Enable Pyflakes `E` and `F` codes by default.
lint.select = [
    "E", "W",  # see: https://pypi.org/project/pycodestyle
    "F",  # see: https://pypi.org/project/pyflakes
    # Public-API docstrings (#139). RATCHET, not a sweep: currently-failing files under
    # src/interpretune are baselined in per-file-ignores below and each authoring slice deletes its
    # own lines. The point is that NEW code cannot add to the debt while the debt is worked down.
    # Deliberately only D101/D102/D103 (missing docstring on public class/method/function) -- style
    # rules like D2xx/D4xx would reformat 694 existing docstrings, which is not what #139 asked for.
    "D101", "D102", "D103",
]
lint.ignore = [
    "E731", # Do not assign a lambda expression, use a def
    "F722", # https://github.com/google/jaxtyping/blob/f18de2ce28e9e01beb1b8d4425ecb23e953075aa/docs/faq.md?plain=1#L21
]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    "docs",
    ".tox",
    "*.egg",
    "build",
    "temp",
    ".github/prompts",
]

output-format = "pylint"  # `format` was deprecated to prepare for upcoming ruff release, using `output-format` instead.


[tool.ruff.lint.per-file-ignores]
#"src/fts_examples/stable/ipynb_src/fts_superglue_nb.py" = ["E501","F401","F821"]
#"src/fts_examples/legacy/ipynb_src/fts_superglue_nb.py" = ["E501","F401","F821"]
"src/it_examples/notebooks/publish/**/*.ipynb" = ["E501"]

# ==== #139 docstring rules: PERMANENT scope exemptions ====================================
# Not debt and not baselined -- these surfaces are deliberately outside the public-API docstring
# contract, so they carry no ratchet lines to delete. `src/interpretune` is the whole scope of #139.
"tests/**" = ["D101", "D102", "D103"]            # test code; CLAUDE.md already exempts tests from type checks
"scripts/**" = ["D101", "D102", "D103"]          # maintainer tooling, not a published API
"requirements/utils/**" = ["D101", "D102", "D103"]  # env-collection tooling; same class as scripts/
"src/it_examples/**" = ["D101", "D102", "D103"]  # examples/research trees (type-exempt for the same reason)

# ==== #139 docstring ratchet BASELINE (src/interpretune only) =============================
# Generated from ruff 0.12.10 (the pre-commit pin) at the time of the ratchet PR. Each entry is a
# file that already failed; the trailing count is its violation count when baselined. Slices delete
# their own lines as they author, so this block SHRINKS monotonically and never grows -- a new file
# under src/interpretune is enforced from birth because it is not listed here.
# DONE-CRITERION for #139: this block is empty.
# --- slice A (#341) -- base/, runners/, top-level  (13 files, 166 violations)
"src/interpretune/adapter_registry.py" = ["D101", "D102", "D103"]  # 1
"src/interpretune/base/call.py" = ["D101", "D102", "D103"]  # 2
"src/interpretune/base/components/cli.py" = ["D101", "D102", "D103"]  # 12
"src/interpretune/base/components/core.py" = ["D101", "D102", "D103"]  # 12
"src/interpretune/base/components/mixins.py" = ["D101", "D102", "D103"]  # 26
"src/interpretune/base/datamodules.py" = ["D101", "D102", "D103"]  # 3
"src/interpretune/base/hooks.py" = ["D101", "D102", "D103"]  # 2
"src/interpretune/base/modules.py" = ["D101", "D102", "D103"]  # 1
"src/interpretune/protocol.py" = ["D101", "D102", "D103"]  # 66
"src/interpretune/registry.py" = ["D101", "D102", "D103"]  # 26
"src/interpretune/runners/analysis.py" = ["D101", "D102", "D103"]  # 2
"src/interpretune/runners/core.py" = ["D101", "D102", "D103"]  # 5
"src/interpretune/session.py" = ["D101", "D102", "D103"]  # 8

# --- slice B (#342) -- config/ only; analysis/ half DONE (was 9 files, 64 violations).
#     Split because config/ overlaps an in-flight registry refactor; see the note on #342.
"src/interpretune/config/analysis.py" = ["D101", "D102", "D103"]  # 3
"src/interpretune/config/datamodule.py" = ["D101", "D102", "D103"]  # 7
"src/interpretune/config/extensions.py" = ["D101", "D102", "D103"]  # 2
"src/interpretune/config/mixins.py" = ["D101", "D102", "D103"]  # 4
"src/interpretune/config/module.py" = ["D101", "D102", "D103"]  # 8
"src/interpretune/config/runner.py" = ["D101", "D102", "D103"]  # 2
"src/interpretune/config/sae_lens.py" = ["D101", "D102", "D103"]  # 3
"src/interpretune/config/shared.py" = ["D101", "D102", "D103"]  # 13
"src/interpretune/config/transformer_lens.py" = ["D101", "D102", "D103"]  # 3

# --- slice C (#343) -- adapters/, extensions/: DONE (was 8 files, 76 violations)

# --- slice D (#344) -- utils/ + residue: DONE (was 10 files, 45 violations)

[tool.ruff.lint.isort]
known-first-party = ["docs", "interpretune","tests"]
force-sort-within-sections = false
order-by-type = false

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pyright]
typeCheckingMode="standard"
include = [
    "src/",
]
exclude = [
    "src/it_examples/utils/raw_graph_analysis.py",
    # relocated research/notebook trees (Phase 4): imported research code + repo-only tests,
    # type-exempt exactly as they were under tests/ before the §11.6 moves
    "src/it_examples/tests",
    "src/it_examples/experiments/notebook",
]

# Custom directives removed for stricter type checking

[tool.coverage.run]
source = ["src/interpretune"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "warnings",
    "pass",
    "raise NotImplementedError",
    "except Exception",
]

exclude_also = [
    "if TYPE_CHECKING:",
]

omit = [
# we test this simple harness but do not include it in coverage to avoid incurring the configuration
# complexity associated with subprocess coverage (https://coverage.readthedocs.io/en/latest/subprocess.html)
# If we use subprocesses for testing beyond merely this 3 line wrapper file, it may make sense to set
# COVERAGE_PROCESS_START, dynamically add a sitecustomize.py etc. in the CI flow to enable subprocess coverage.
# "src/interpretune/run_experiment.py",
]

[tool.pytest.ini_options]
pythonpath = "tests"
importmode = "importlib"
norecursedirs = [
    ".git",
    ".github",
    "dist",
    "build",
    "docs",
]
#addopts = "--strict-markers --doctest-modules --color=yes --disable-pytest-warnings --ignore-glob='src/fts_examples/*/ipynb_src/*.py' --ignore='.actions/assistant.py'"
addopts = "--strict-markers --doctest-modules --color=yes --disable-pytest-warnings --ignore-glob='tests/*_parity/*.py' --ignore-glob='src/it_examples/notebooks/**/*.py'"
junit_duration_report = "call"
tmp_path_retention_count = 30  # allow retention of more successful runs during profiling result generation (default 3)


[tool.jupytext]
notebook_metadata_filter = "-all"

[tool.jupytext.formats]
"notebooks/" = "ipynb"
"scripts/" = "py"
