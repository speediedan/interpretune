# Frozen interpretune-minus-upstream bounds, per vendor, per composition, per gated metric:
#
#   <vendor>:                 # cuda (NVIDIA), rocm (AMD)
#     <composition>:
#       <metric>:             # peak_alloc, end_current, slope[<phase>], transition[<a>-><b>]
#         baseline: <bytes>   # median delta when frozen
#         tolerance: <bytes>  # max(3 x p95(repeat spread), floor); floor 8 MiB on bytes, 64 KiB/step on slopes
#
# A composition with no entry for the running vendor is report-only: it is measured and its artifact written, but
# nothing is asserted. Bounds are frozen only from spread measured on BOTH vendors (`python -m
# tests.profiling_delta.freeze`), and revised only with a recorded re-measurement.
#
# Frozen 2026-10-25 from two 5-repeat runs per vendor, the second with these bounds enforced: NVIDIA RTX 4090 (torch
# 2.15.0+cu130) and AMD (torch 2.15.0+rocm10.0). Every metric showed zero spread across repeats and across runs, so
# every tolerance is its floor. Runs on a 2070 SUPER matched the 4090 within 2.4 MiB (bf16) and to the byte elsewhere.
# tl_train and tl_test are not frozen: interpretune's TransformerLens composition holds ~81 MiB more than a native
# TransformerBridge.boot_transformers bridge on both vendors (steady, no slope), which is attributed before a bound
# would accept it as the baseline.
# sae_lens_train and sae_lens_test are not frozen for the same reason (#825, measured 2026-10-25 on NVIDIA): their
# steady +55 to +105 MiB is dominated by the #824 bridge-conversion overhead (the live-tensor inventory shows the
# same extra split 768x768 attention matrices), so they stay report-only until #824 is attributed.
# nnsight_test measured a zero delta and circuit_tracer_test +19 MiB peak / +0.1 MiB retained on NVIDIA the same
# day; neither is frozen yet because no AMD measurement of them exists to freeze from.
