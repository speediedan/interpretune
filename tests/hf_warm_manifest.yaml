# Hub artifacts the hosted CI matrix warms into the Hugging Face cache before running the suite with
# HF_HUB_OFFLINE=1 (see docs/ci_hub_cache.md). Warmed by scripts/warm_hf_cache.py; the actions cache is
# keyed on this file's hash, so editing it (including cache_version) refreshes every runner's cache.
#
# A test that needs an artifact not listed here fails offline with a message naming this file. Add the
# repository (and for datasets the config name the test loads) rather than lifting offline mode; a test
# that must reach the live Hub is marked @pytest.mark.hf_live and runs in the separate online pass.
#
# WHICH of the two applies is the part worth stating, because the mechanism above does not decide it, and
# two lanes reached the same criterion independently on the same day while making that choice:
#
#   Warm it here     when the artifact is INPUT the test needs in order to exercise something else.
#   Mark it hf_live  when reaching the Hub IS what the test exercises.
#
# The question that decides it: would a warm cache make this test pass WITHOUT exercising the thing it
# exists to exercise? A resolution test that discovers a repository's real layout and a pinned-pull test
# that verifies a fetch both fail that question, and warming either would leave a green test that checks
# nothing. A tokenizer that a session fixture happens to load passes it easily.
cache_version: 2
models:
  # Both spellings are used in the tree and cache under separate directories, so both are warmed.
  - repo_id: gpt2
    allow_patterns: ["*.json", "*.txt", "model.safetensors"]
  - repo_id: openai-community/gpt2
    allow_patterns: ["*.json", "*.txt", "model.safetensors"]
  # SAE-Lens releases the adapter tests load: `gpt2-small-res-jb` (residual SAEs, three layers) and
  # `gpt2-small-hook-z-kk` (attention SAEs; the file names carry the layer as `_L<n>_`).
  - repo_id: jbloom/GPT2-Small-SAEs-Reformatted
    allow_patterns: ["blocks.0.hook_resid_pre/*", "blocks.1.hook_resid_pre/*", "blocks.9.hook_resid_pre/*"]
  - repo_id: ckkissane/attn-saes-gpt2-small-all-layers
    allow_patterns: ["gpt2-small_L1_*", "gpt2-small_L2_*", "gpt2-small_L9_*", "gpt2-small_L10_*"]
  # OpenAI's v5 residual SAEs (trained on GPT-2's raw weights, so they declare no weight processing): the NNsight
  # sae_lens composition and the sae_lens profiling pair attach the first two layers.
  - repo_id: jbloom/GPT2-Small-OAI-v5-32k-resid-post-SAEs
    allow_patterns: ["v5_32k_layer_0.pt/*", "v5_32k_layer_1.pt/*"]
  # Gemma Scope 2 residual SAE the conformance suite attaches for the gemma-3-1b-it circuit-tracer
  # target (one layer only; the full release is tens of gigabytes the suite never loads).
  - repo_id: google/gemma-scope-2-1b-it
    allow_patterns: ["resid_post/layer_13_width_16k_l0_big/*"]
  # TransformerLens' `tiny-stories-1M` alias, used by the transcoder tests.
  - repo_id: roneneldan/TinyStories-1M
  # gpt2-small Jacobian lens, input to the #420 real-lens non-collinearity measurement (offline CPU:
  # path + revision are passed explicitly, so no Hub listing is needed). Few megabytes.
  - repo_id: neuronpedia/jacobian-lens
    allow_patterns: ["gpt2-small/*"]
    revision: 0731326edff4ae730ffc5356fe1a4728c748b3a6
  # The dynamic-module load test reads falcon's config and remote-code modules, not its weights.
  - repo_id: tiiuae/falcon-7b
    allow_patterns: ["*.json", "*.py"]
  # Tokenizers only (about 48 MB, no weights) for the chat-template equivalence tests, which skip when a
  # tokenizer cannot load. Without these they ran only on the self-hosted GPU pipeline's CPU phase; warming
  # them here is what lets that phase go. Both repositories are gated, so the warming token needs access.
  - repo_id: google/gemma-3-1b-it
    allow_patterns: ["tokenizer*", "special_tokens_map.json", "added_tokens.json", "config.json", "chat_template*"]
  - repo_id: meta-llama/Llama-3.2-3B-Instruct
    allow_patterns: ["tokenizer*", "special_tokens_map.json", "added_tokens.json", "config.json", "chat_template*"]
  # The oracle lens component's CPU tests (#1202): the tokenizer its injection marker is found on, and the config a
  # tiny random model of the same architecture is built from. No weights. Pinned to the base the lens was trained on.
  - repo_id: Qwen/Qwen3.6-27B
    allow_patterns: ["tokenizer*", "vocab.json", "merges.txt", "config.json", "chat_template*"]
    revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
datasets:
  - path: aps/super_glue
    config_name: rte
  # The debug-generation extension's default corpus.
  - path: Salesforce/wikitext
    config_name: wikitext-2-raw-v1
components:
  # The RTE/BoolQ experiment, Hub-resident post-#497: the test registry, backbone, and conformance
  # seeds resolve its classes from the components cache, offline. Pinned revision; bump with intent.
  - repo_id: speediedan/rte
    revision: 4e58126454837a6572b13c9d53c1af15e0605478
  # The Gemma and Llama3 prompt definitions that test-registry and CLI configurations compose by reference
  # (`compose_ref`). Hub-resident like rte, so core tests read them from the cache rather than from it_examples.
  - repo_id: speediedan/prompt-configs
    revision: 3d8b9710061283dd14c86a46f0c0649b5e262db0
  # The task-neutral prompt-analysis component the circuit-tracer notebooks load (free-form prompts, no task head).
  # Pinned revision; bump with intent.
  - repo_id: speediedan/prompt-analysis
    revision: d221f0e9293888836a0101509546968eced813bd
venngram:
  # venngram's registry at one pinned generation (#900): every module's default view looks its component map and
  # overlay maps up there. tests/conftest.py sets VENNGRAM_REGISTRIES from this list unless the environment names one,
  # and the warm step fetches every map and overlay it indexes into venngram's cache (VENNGRAM_CACHE, else
  # ~/.cache/venngram, which the actions cache saves beside the Hub cache). Component maps are read from here alone
  # (#1026), so this generation must carry a verified row for every architecture the suite supports
  # (tests/core/mapped_architectures.py), including MistralForCausalLM, Qwen3ForCausalLM and Qwen3_5ForCausalLM.
  registries:
    - hub-dataset:speediedan/venngram-registry/index@2d631edc53590d9b3e73d48c695724456686445d
