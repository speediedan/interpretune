# GPU test areas: which changed paths need which GPU tests.
#
# Composition, for one change set (union over changed paths):
#   - a path matching `run_all`                       -> the full GPU set (absorbing)
#   - a path matching `ignore`                        -> no GPU tests
#   - a path matching an area's `paths`               -> that area's `tests` (several areas may match)
#   - a path no other area matches, matching an area marked `fallback: true` -> that area's `tests` (so a new file
#     under a directory split file by file still selects the directory's tests rather than the full set)
#   - a changed test module (`test_*.py`)             -> its own GPU tests
#   - a changed test-support module under `tests/`    -> the GPU tests of every test module importing it,
#                                                        transitively (computed, not listed here)
#   - ANY OTHER PATH                                  -> the full GPU set, named in the output (refuse to guess)
# Globs: `**` crosses directories, `*` stays within one path segment. Area `tests` are node-id prefixes.
version: 1

run_all:
  # dependency and build surface
  - pyproject.toml
  - setup.*
  - requirements.txt
  # what the GPU job installs (requirements/ci) and runs (requirements/utils); requirements/docs.txt is ignored below
  - requirements/ci/**
  - requirements/utils/**
  - .azure-pipelines/**
  # the selection machinery and the infrastructure every GPU test runs through (fixtures, marks, phases, placement and
  # warming data). Listed rather than `tests/gpu_ci/**`, so the release-only files below select nothing and a new file
  # here is unclassified (a full run) until it is placed.
  - tests/gpu_ci/*.py
  - tests/gpu_ci/areas.yaml
  - tests/gpu_ci/hf_warm_manifest_gpu.yaml
  - tests/gpu_ci/phase_collection_manifest.json
  - tests/conftest.py
  - tests/runif.py
  - tests/base_defaults.py
  - tests/orchestration.py
  - tests/module_registry.py
  - tests/modules.py
  - tests/test_module_registry.yaml
  - tests/configuration.py
  - tests/core/cfg_aliases.py
  - tests/.experiments
  # library surface every registry-backed session is built through
  - src/interpretune/__init__.py
  - src/interpretune/session.py
  - src/interpretune/protocol.py
  - src/interpretune/registry.py
  - src/interpretune/metadata.py
  - src/interpretune/module_registry.yaml
  - src/interpretune/adapter_registry.py
  - src/interpretune/adapters/__init__.py
  - src/interpretune/adapters/_light_register.py
  - src/interpretune/adapters/registration.py
  - src/interpretune/config/__init__.py
  - src/interpretune/config/loading.py
  - src/interpretune/config/shared.py
  - src/interpretune/config/module.py
  - src/interpretune/config/datamodule.py
  - src/interpretune/config/mixins.py
  - src/interpretune/hub/__init__.py
  - src/interpretune/hub/api.py
  - src/interpretune/hub/components.py
  - src/interpretune/hub/manifest.py
  - src/interpretune/hub/entrypoints.py
  - src/interpretune/hub/trust.py
  - src/interpretune/hub/revisions.py
  - src/interpretune/hub/cache.py
  - src/interpretune/hub/pins.py
  - src/interpretune/hub/precedence.py
  - src/interpretune/hub/promptconfigs.py
  - src/interpretune/hub/manager.py
  - src/interpretune/runners/__init__.py
  - src/it_examples/seeds.py
  - src/it_examples/__init__.py
  - src/it_examples/tests/__init__.py

ignore:
  # agent tooling, docs and packaging metadata
  - .agents/**
  - .claude/**
  - ".env*.example"
  - .readthedocs.yml
  - MANIFEST.in
  - docs/**
  - scripts/**
  - .github/**
  - "**/*.md"
  - .codecov.yml
  - .pre-commit-config.yaml
  - .gitignore
  - CITATION.cff
  - LICENSE
  - Makefile
  # read only by the docs build; the GPU job installs requirements/ci
  - requirements/docs.txt
  # read only by the release legs (reviewed skips, release eligibility); their CPU tests check them on every pull
  # request, and a gate's report does not gate on them (2 of 9 measured full-run fallbacks, 2026-11)
  - tests/gpu_ci/reviewed_exclusions.json
  - tests/gpu_ci/release.json
  # a calibration record (tests/gpu_ci/calibrate.py writes it, keyed by node id); no test reads it at run time, the
  # placement a test gets comes from its own declaration (3 of 9 measured full-run fallbacks, 2026-11)
  - tests/gpu_ci/vram_measurements.yaml
  - dockers/**
  - src/interpretune/__about__.py
  - src/interpretune/py.typed
  # type stubs: no runtime effect (the ops they describe select through their own sources)
  - "**/*.pyi"
  - src/interpretune/hub/publish.py
  - src/interpretune/hub/cards.py
  # store discovery reads Hub listings and envelopes only; nothing it does reaches a device
  - src/interpretune/hub/discovery.py
  # imports the Python files a component declares, on an explicit `load_helpers` call that no GPU test makes
  - src/interpretune/hub/helpers.py
  - src/interpretune/utils/neuronpedia_*
  - src/interpretune/utils/_neuronpedia_utils_fallbacks.py
  - src/interpretune/utils/notebook_config.py
  - src/interpretune/utils/schema_validation.py
  - src/interpretune/utils/requirements.py
  - src/it_examples/neuronpedia_dashboard/**
  - src/it_examples/experiments/**
  - src/it_examples/utils/dashboard_pretokenization_rte.py
  # dev notebooks are sources; the tests execute the published copies
  - src/it_examples/notebooks/dev/**
  - src/it_examples/notebooks/publish/.notebook_hashes.json
  - src/it_examples/notebooks/publish/quickstart/**
  - src/it_examples/notebooks/publish/shared_analysis/**
  - src/it_examples/notebooks/publish/example_op_collections/**
  - src/it_examples/notebooks/publish/interp_engine_example/**
  # the runner-flexibility demo is a CPU notebook, tested on the hosted matrix
  - src/it_examples/notebooks/publish/runners/**
  # so is the role-kinds tuning notebook
  - src/it_examples/notebooks/publish/tuning/**
  # so is the gradient-readouts notebook
  - src/it_examples/notebooks/publish/gradient_readouts/**
  # benchmarks run in no pipeline phase; the warm manifest is read only by the hosted matrix
  - tests/benchmarks/**
  - tests/hf_warm_manifest.yaml
  # read only by the CPU neuronpedia dashboard tests
  - tests/fixtures/neuronpedia_dashboard_phase4/**
  - tests/*.md

areas:
  core:
    # parity acceptance across the adapter compositions, the CLI, and the CI profiling tests
    paths:
      - src/interpretune/adapters/core.py
      - src/interpretune/adapters/lightning.py
      - src/interpretune/adapters/transformer_lens/**
      - src/interpretune/adapters/nnsight/**
      - src/interpretune/adapters/sae_lens/**
      - src/interpretune/base/**
      # every module attaches its finetuning-scheduler view at init, and the default optimizer reads it (#758, #761)
      - src/interpretune/tuning/**
      - src/interpretune/config/runner.py
      - src/interpretune/config/extensions.py
      # the bundled extensions' configuration classes (#624)
      - src/interpretune/config/extension_cfgs.py
      - src/interpretune/config/profiling.py
      - src/interpretune/runners/core.py
      - src/interpretune/runners/distributed.py
      - src/interpretune/extensions/__init__.py
      - src/interpretune/extensions/memprofiler.py
      - src/interpretune/utils/**
      - src/interpretune/hub/adapters.py
      - src/it_examples/examples/**
      - tests/core/fixtures/**
      - tests/parity_acceptance/**
    tests:
      - tests/parity_acceptance/
      - tests/core/test_components_cli.py
  profiling_delta:
    # the interpretune-minus-upstream memory delta harness: a change to its frozen bounds selects its pairs (#823)
    paths:
      - tests/profiling_delta/**
    tests:
      - tests/profiling_delta/
  base_ext:
    # HF from_pretrained/peft mixins, debug generation, memory profiler, device utilities
    paths:
      - src/interpretune/base/**
      - src/interpretune/tuning/**
      - src/interpretune/adapters/core.py
      - src/interpretune/adapters/lightning.py
      - src/interpretune/adapters/sae_lens/**
      - src/interpretune/runners/core.py
      - src/interpretune/runners/distributed.py
      - src/interpretune/extensions/**
      - src/interpretune/config/extension_cfgs.py
      - src/interpretune/utils/**
      # launched by path rather than imported, so no import edge reaches the tests that run it
      - tests/core/distributed_core_loop_worker.py
    tests:
      - tests/core/test_components_mixins.py
      - tests/core/test_debug_generation.py
      - tests/core/test_utils.py
      - tests/core/test_adapters_sae_lens.py
      - tests/core/test_memprofiler.py
      # a bitsandbytes 4-bit base under LoRA adapters: thawing its packed storage is refused, the adapters train (#758)
      - tests/core/test_tuning_packed_storage.py
      # the core loop's placements on two GPUs: tensor-parallel transcoder tuning against one GPU
      - tests/core/test_core_loop_distributed.py
      - tests/gpu_ci/
  tl_arch:
    # the TransformerLens view's parameter mapping on gated llama3/gemma2
    paths:
      - src/interpretune/adapters/transformer_lens/**
    tests:
      - tests/core/test_adapters_transformer_lens.py
  analysis:
    # the analysis stack every analysis GPU test runs through
    paths:
      - src/interpretune/analysis/*.py
      - src/interpretune/analysis/points/**
      - src/interpretune/analysis/venngram/**
      - src/interpretune/analysis/backends/**
      - src/interpretune/analysis/ops/*.py
      - src/interpretune/analysis/ops/compiler/**
      - src/interpretune/analysis/ops/bundled/*.py
      - src/interpretune/analysis/ops/bundled/*.yaml
      - src/interpretune/analysis/ops/bundled/core/**
      - src/interpretune/analysis/ops/bundled/latent/**
      - src/interpretune/config/analysis.py
      - src/interpretune/runners/analysis.py
      - src/interpretune/hub/opcollections.py
      - src/interpretune/hub/artifacts.py
      - src/interpretune/hub/subject.py
      - src/interpretune/hub/hookmaps.py
    tests:
      - tests/core/test_backend_conformance.py::TestCircuitTracerConformance
      - tests/core/test_analysis_backend_parity.py
      - tests/core/test_jlens_
  circuit_tracer:
    # circuit-tracer backends and the model-backend conformance target (gemma-3-1b-it). The conformance class composes
    # core, nnsight, circuit_tracer and sae_lens, so a TransformerLens change does not reach it: that selects
    # `circuit_tracer_tl` instead (the class is 8.4 of a full run's 22 GPU minutes, measured on builds 2065 and 2087).
    paths:
      - src/interpretune/adapters/circuit_tracer/**
      - src/interpretune/adapters/nnsight/**
      - src/interpretune/adapters/sae_lens/**
      - src/interpretune/testing/**
      - src/interpretune/analysis/ops/bundled/circuit_tracer/**
      - src/interpretune/analysis/ops/bundled/attribution/**
      - src/interpretune/analysis/ops/bundled/concept/**
      - src/interpretune/analysis/ops/bundled/sae/**
    tests:
      - tests/core/test_backend_conformance.py::TestCircuitTracerConformance
      - tests/core/test_adapters_circuit_tracer.py
      - tests/core/test_analysis_backend_parity.py
      # the two public notebooks whose nnsight composition registers no HF module, the shape #859's regression hit
      # (about 2.5 min together on the NVIDIA agent); the rest of `ct_notebooks` stays selected by its own sources
      - src/it_examples/tests/test_notebooks.py::test_ct_analysis_backend_notebook[ct_analysis_backend_nnsight_public]
      - src/it_examples/tests/test_notebooks.py::test_ct_concept_steering_notebook[ct_concept_steering_public]
  circuit_tracer_tl:
    # circuit-tracer over a TransformerLens backend, and the backend parity it is checked against
    paths:
      - src/interpretune/adapters/transformer_lens/**
    tests:
      - tests/core/test_adapters_circuit_tracer.py
      - tests/core/test_analysis_backend_parity.py
  jlens:
    paths:
      - src/interpretune/analysis/ops/bundled/jlens/**
      - src/interpretune/analysis/optools.py
      - src/interpretune/adapters/nnsight/backends.py
      - src/interpretune/adapters/transformer_lens/backends.py
      - src/interpretune/harness/sessions.py
      - src/it_examples/notebooks/publish/circuit_tracer_examples/jspace_workspace_demo.ipynb
      - src/it_examples/tests/notebook/**
    tests:
      - tests/core/test_jlens_
      - src/it_examples/tests/test_notebooks.py::test_jspace_workspace_notebook
  latent_dynamics_notebook:
    # runs the concept-direction component's latent-dynamics analysis, fetched from the Hub at a pinned revision
    paths:
      - src/it_examples/notebooks/publish/circuit_tracer_examples/concept_direction_latent_dynamics.ipynb
    tests:
      - src/it_examples/tests/test_notebooks.py::test_concept_direction_latent_dynamics_notebook
  ct_notebooks:
    # Example notebooks on real models (9.1 of a full run's 22 GPU minutes, builds 2065 and 2087). This area is what
    # every one of them loads: the harness package's import chain (`interpretune.harness` loads bootstrap, config and
    # experiments), the injection machinery `example_helpers` imports, and the notebook test harness. The areas
    # below select one notebook (or the few importing a helper), so a change to one notebook or helper runs only its
    # users; every other change reaches them through the nightly full run.
    paths:
      - src/interpretune/analysis/injection/**
      - src/interpretune/extensions/neuronpedia.py
      - src/interpretune/config/extension_cfgs.py
      - src/interpretune/harness/__init__.py
      - src/interpretune/harness/bootstrap.py
      - src/interpretune/harness/config.py
      - src/interpretune/harness/experiments.py
      - src/interpretune/harness/configs/**
      - src/interpretune/harness/launcher.py
      - src/interpretune/harness/resources.py
      - src/interpretune/harness/cleanup.py
      - src/interpretune/harness/nb_harness_utils.py
      - src/it_examples/tests/notebook/**
    tests:
      - src/it_examples/tests/test_notebooks.py::test_attribution_analysis_notebook
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_notebooks
      - src/it_examples/tests/test_notebooks.py::test_ct_
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_w_neuronpedia_notebook
      - src/it_examples/tests/test_notebooks.py::test_concept_direction_latent_dynamics_notebook
  ct_notebooks_new:
    # anything else under the notebook sources and helpers (a new notebook or helper): every notebook test, as before
    # the split. Only for a path none of the areas above or below names.
    fallback: true
    paths:
      - src/interpretune/harness/**
      - src/it_examples/utils/**
      - src/it_examples/notebooks/publish/attribution_analysis/**
      - src/it_examples/notebooks/publish/circuit_tracer_examples/**
      - src/it_examples/notebooks/publish/neuronpedia_example/**
    tests:
      - src/it_examples/tests/test_notebooks.py::test_attribution_analysis_notebook
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_notebooks
      - src/it_examples/tests/test_notebooks.py::test_ct_
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_w_neuronpedia_notebook
      - src/it_examples/tests/test_notebooks.py::test_jspace_workspace_notebook
  nb_example_helpers:
    # imported by the attribution, circuit-tracer basic, ct analysis-backend, concept-steering and neuronpedia notebooks
    paths:
      - src/it_examples/utils/example_helpers.py
      - src/interpretune/harness/notebook_inputs.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_attribution_analysis_notebook
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_notebooks
      - src/it_examples/tests/test_notebooks.py::test_ct_analysis_backend_notebook
      - src/it_examples/tests/test_notebooks.py::test_ct_concept_steering_notebook
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_w_neuronpedia_notebook
  nb_ui:
    # imported by the ct analysis-backend, concept-steering and J-space workspace notebooks
    paths:
      - src/it_examples/utils/nb_ui_utils.py
      - src/interpretune/harness/notebook_ui.py
      - src/interpretune/harness/display.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_ct_analysis_backend_notebook
      - src/it_examples/tests/test_notebooks.py::test_ct_concept_steering_notebook
      - src/it_examples/tests/test_notebooks.py::test_jspace_workspace_notebook
  nb_attribution:
    paths:
      - src/it_examples/notebooks/publish/attribution_analysis/**
      - src/it_examples/utils/graph_analysis_helpers.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_attribution_analysis_notebook
  nb_ct_basic:
    paths:
      - src/it_examples/notebooks/publish/circuit_tracer_examples/circuit_tracer_adapter_example_basic.ipynb
    tests:
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_notebooks
  nb_ct_analysis_backend:
    paths:
      - src/it_examples/notebooks/publish/circuit_tracer_examples/ct_analysis_backend_demo*.ipynb
    tests:
      - src/it_examples/tests/test_notebooks.py::test_ct_analysis_backend_notebook
  nb_ct_concept_steering:
    paths:
      - src/it_examples/notebooks/publish/circuit_tracer_examples/ct_concept_steering_demo*.ipynb
      - src/it_examples/utils/steering_demo_helpers.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_ct_concept_steering_notebook
  nb_neuronpedia:
    paths:
      - src/it_examples/notebooks/publish/neuronpedia_example/**
    tests:
      - src/it_examples/tests/test_notebooks.py::test_circuit_tracer_w_neuronpedia_notebook
  nb_neuron_communities:
    # the Llama-3.1-8B replication; its test is optional-tier (a gated 8B model and network prompt sources), so a
    # pull-request gate selects it without running it and the optional tier runs it
    paths:
      - src/it_examples/notebooks/publish/neuron_communities/**
      - src/it_examples/utils/neuron_communities_helpers.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_neuron_communities_notebook
  nb_bsf_blocks:
    # the block-sparse featurizer blocks example on gemma-3-1b-it (#866): decision blocks ranked, edited natively at the
    # featurizer's latent sub-hook against random blocks, and tuned through feature adapters by role
    paths:
      - src/it_examples/notebooks/publish/bsf_blocks/**
      - src/it_examples/utils/bsf_featurizers.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_bsf_blocks_notebook
  nb_neuron_finder:
    # the neuron-finder example on Qwen3-0.6B (#869): screens, a dose sweep through address books on nnsight, the same
    # book on TransformerLens, and unit-adapter tuning by role
    paths:
      - src/it_examples/notebooks/publish/neuron_finder/**
      - src/it_examples/utils/neuron_finder.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_neuron_finder_notebook
  nb_sasa_blocks:
    # the SASA blocks example on Mistral-7B; its test is optional-tier (a 7B model and network prompt sources), so a
    # pull-request gate selects it without running it and the optional tier runs it
    paths:
      - src/it_examples/notebooks/publish/sasa_blocks/**
      - src/it_examples/utils/sasa_blocks_helpers.py
    tests:
      - src/it_examples/tests/test_notebooks.py::test_sasa_blocks_notebook
  sae_lens_notebooks:
    paths:
      - src/it_examples/notebooks/publish/saelens_adapter_example/**
      - src/it_examples/tests/notebook/**
    tests:
      - src/it_examples/tests/test_notebooks.py::test_sae_lens_notebooks

# The few slow cases a per-change gate leaves to the full run (main, scheduled and run_all builds keep every one). Each
# is a node id an area's `tests` select; a gate whose change set touches none of its `unless_changed` paths drops it,
# and the run's output says how many it deferred. Each entry's path still runs in the gate through a cheaper case
# (`covered_by`), so a gate keeps every composition path while the broadest, most expensive form of the check waits
# for the full run. `unless_changed` names the code the case uniquely exercises: a change there keeps it in the gate.
full_run_only:
  - test: tests/core/test_backend_conformance.py::TestCircuitTracerConformance::test_every_declared_point_is_captured
    why: captures every declared point of gemma-3-1b-it in one run (about 120 s of the class's 505 s on a 4090)
    covered_by: [test_cache_op_stores_logits_and_every_requested_point, test_capture_converges_on_the_forward]
    unless_changed:
      - src/interpretune/testing/conformance/**
      - tests/core/test_backend_conformance.py
      - src/interpretune/adapters/nnsight/**
      - src/interpretune/analysis/points/**
  - test: tests/core/test_backend_conformance.py::TestCircuitTracerConformance::test_a_gradient_edit_matches_a_manual_backward_hook
    why: four HF backward references over gemma-3-1b-it beside the op's run (75 to 95 s)
    covered_by: [test_a_gradient_edit_reaches_a_latent_sub_hook, test_gradient_op_stores_the_declared_schema]
    unless_changed:
      - src/interpretune/testing/conformance/**
      - tests/core/test_backend_conformance.py
      - src/interpretune/adapters/nnsight/**
      - src/interpretune/analysis/injection/**
      - src/interpretune/analysis/ops/bundled/concept/**
  - test: tests/core/test_backend_conformance.py::TestCircuitTracerConformance::test_mixed_modes_apply_in_declaration_order
    why: one run per declared mode plus the mixed run and their HF references (about 50 s)
    covered_by: [test_declared_modes_are_distinguishable, test_mixed_scopes_produce_the_per_scope_result]
    unless_changed:
      - src/interpretune/testing/conformance/**
      - tests/core/test_backend_conformance.py
      - src/interpretune/adapters/nnsight/**
      - src/interpretune/analysis/injection/**
