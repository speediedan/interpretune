# A test fixture, not a bundled map: only here until venngram's registry serves Qwen3_5ForCausalLM (#1026). The
# suite registers it in process (tests/conftest.py) so the text-only Qwen3.5 class resolves offline; delete it, and
# that registration, once the registry's CI warm generation carries a verified row for the class.
#
# Qwen3_5ForCausalLM: the text-only Qwen3.5 class (NNsight loads a Qwen3.5 checkpoint through it for generation).
# Derived from maps/v5/qwen3_5.yaml: the language model's rows with `model.language_model.` read as `model.`, the
# vision stack and projector dropped. Layouts measured against Qwen/Qwen3.5-4B's text configuration.
schema_version: 5
architecture: Qwen3_5ForCausalLM
properties:
  sandwich_norms: false
kinds:
  linear_attn:
    output: tensor
    sublayer: true
components:
  embed:
    module: model.embed_tokens
    kind: embed
    layout: in_out
  blocks.{i}:
    module: model.layers.{i}
    kind: block
  blocks.{i}.ln1:
    module: model.layers.{i}.input_layernorm
    kind: norm
  blocks.{i}.attn:
    module: model.layers.{i}.self_attn
    kind: attn
    optional: true
  blocks.{i}.attn.q:
    module: model.layers.{i}.self_attn.q_proj
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.attn.k:
    module: model.layers.{i}.self_attn.k_proj
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.attn.v:
    module: model.layers.{i}.self_attn.v_proj
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.attn.q_norm:
    module: model.layers.{i}.self_attn.q_norm
    kind: norm
    optional: true
  blocks.{i}.attn.k_norm:
    module: model.layers.{i}.self_attn.k_norm
    kind: norm
    optional: true
  blocks.{i}.attn.o:
    module: model.layers.{i}.self_attn.o_proj
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.linear_attn:
    module: model.layers.{i}.linear_attn
    kind: linear_attn
    optional: true
  blocks.{i}.linear_attn.in_qkv:
    module: model.layers.{i}.linear_attn.in_proj_qkv
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.linear_attn.in_z:
    module: model.layers.{i}.linear_attn.in_proj_z
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.linear_attn.in_b:
    module: model.layers.{i}.linear_attn.in_proj_b
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.linear_attn.in_a:
    module: model.layers.{i}.linear_attn.in_proj_a
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.linear_attn.conv:
    module: model.layers.{i}.linear_attn.conv1d
    kind: linear
    optional: true
  blocks.{i}.linear_attn.norm:
    module: model.layers.{i}.linear_attn.norm
    kind: norm
    optional: true
  blocks.{i}.linear_attn.out:
    module: model.layers.{i}.linear_attn.out_proj
    kind: linear
    optional: true
    layout: out_in
  blocks.{i}.ln2:
    module: model.layers.{i}.post_attention_layernorm
    kind: norm
  blocks.{i}.mlp:
    module: model.layers.{i}.mlp
    kind: mlp
  blocks.{i}.mlp.gate:
    module: model.layers.{i}.mlp.gate_proj
    kind: linear
    layout: out_in
  blocks.{i}.mlp.in:
    module: model.layers.{i}.mlp.up_proj
    kind: linear
    layout: out_in
  blocks.{i}.mlp.out:
    module: model.layers.{i}.mlp.down_proj
    kind: linear
    layout: out_in
  ln_final:
    module: model.norm
    kind: norm
  unembed:
    module: lm_head
    kind: unembed
    layout: out_in
verification:
  config:
    lin_k_heads:
    - linear_num_key_heads
    lin_v_heads:
    - linear_num_value_heads
    lin_k_dim:
    - linear_key_head_dim
    lin_v_dim:
    - linear_value_head_dim
  widths:
    attn.q:
      out: 2 * heads * head_dim
    linear_attn.in_qkv:
      in: hidden
      out: 2 * lin_k_heads * lin_k_dim + lin_v_heads * lin_v_dim
    linear_attn.in_z:
      in: hidden
      out: lin_v_heads * lin_v_dim
    linear_attn.in_b:
      in: hidden
      out: lin_v_heads
    linear_attn.in_a:
      in: hidden
      out: lin_v_heads
    linear_attn.norm:
      numel: lin_v_dim
    linear_attn.out:
      in: lin_v_heads * lin_v_dim
      out: hidden
  order:
    norm_then_linear_attn:
    - ln1
    - - linear_attn.in_qkv
      - linear_attn.in_z
      - linear_attn.in_b
      - linear_attn.in_a
    linear_attn_projections_then_output:
    - - linear_attn.in_qkv
      - linear_attn.in_z
    - linear_attn.norm
    - linear_attn.out
    linear_attn_then_mlp:
    - linear_attn.out
    - ln2
