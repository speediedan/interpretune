# interpretune#697's phased schedule for gemma-3-1b-it on RTE (26 decoder layers), named as an interpretune module
# names them (`model.` is the module's HF model). Phase 2 is the rest of the model; #697 never reaches it
# (`max_depth: 1` in the driver). Each phase sets its learning rate: one that does not gets finetuning-scheduler's
# `base_max_lr`. Phases advance on a validation-loss plateau (the driver's transition policy), so none sets
# `max_transition_epoch`.
0:
  params:
  - model.model.norm.weight
  - model.model.layers.2[2-5]\..*
1:
  params:
  - model.model.layers.(1[4-9]|2[01])\..*
  lr: 1.0e-05
2:
  params:
  - model.model.layers.([0-9]|1[0-3])\..*
  - model.model.embed_tokens.weight
  lr: 1.0e-05
