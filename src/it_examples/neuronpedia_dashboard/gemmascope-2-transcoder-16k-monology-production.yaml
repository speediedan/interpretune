# All-layer Monology 16k dashboard generation for gemma-3-1b-it (2026-07-31).
#
# Purpose: regenerate the `gemmascope-2-transcoder-16k` source set with the current columnar_gpu
# lane, so the documented single-GPU end-to-end example in docs/neuronpedia_dashboard_pipeline.md is
# a run we actually executed and timed, and so the local-Neuronpedia steering notebook has a freshly
# generated substrate.
#
# Prompt sourcing: streaming `load_dataset` over monology/pile-uncopyrighted, matching the 262k
# production config. SAEDashboard tokenizes/concatenates to 128-token contexts. The pretokenization
# CLI is documented separately in the pipeline guide as an option; it is NOT the path used here.
#
# n_prompts = 4,096. A 24,576-prompt rerun IS feasible on this host but needs the peak-memory flag
# set below; a 2026-08-01 attempt without them was OOM-killed by the kernel.
#
# The feature-acts accumulation buffer is (n_prompts * n_tokens_in_prompt) * n_features_per_batch,
# in BFLOAT16 (`feature_data_generator.py` casts to bf16 -- 2 bytes, not 4):
#   24,576 * 128 * 4096 * 2 = ~24 GiB   (4,096 prompts = ~4 GiB)
# That fits a 62 GiB host on its own. What kills it is the buffer being reallocated at every
# feature-batch transition, so the allocator transiently holds two ~24 GiB buffers. SAEDashboard
# `b092461` made the buffer run-persistent, and the benchmark suite additionally preloads jemalloc.
#
# PROVEN 24,576 recipe (benchmark leg `columnar_monology_promptsweep_4096x256x24576`, measured
# ~28 GiB RSS / ~22 GiB GPU / ~231 s per feature-batch, i.e. ~15 min/layer, ~6.5 h for 26 layers):
#   runner_columnar_max_staged_acts_bytes: 0     # force host staging
#   runner_columnar_row_chunk_size: 16           # bounds the GPU-side quantile transient
#   launcher.env.LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so
# plus SAEDashboard >= b092461 (buffer reuse). Note these are DIFFERENT budgets: row_chunk_size
# bounds a GPU transient in quantile selection and does nothing for the host buffer, which is why
# lowering it alone still gets the run OOM-killed on the host.
#
# Artifact size is essentially UNCHANGED by prompt count, which is why a rerun is cheap in bytes. Stored
# rows per feature are hard-bounded at top_acts_group_size + n_quantiles * quantile_group_size =
# 20 + 5*5 = 45 (SAEDashboard `SequencesConfig` / `NeuronpediaRunnerConfig`), and row width is the
# context length, not the prompt count. More prompts therefore buy a better-selected top-k and more
# populated quantile intervals at ~constant bytes; what scales ~6x is generation TIME (the 4,096-prompt
# run took 58 min for 26 layers).
#
# Parquet page index is ON (SAEDashboard `columnar_write_page_index`, default true). It costs ~0.01%
# in size and cannot be added afterwards without rewriting every file, so a corpus generated without
# it can only be fixed by regenerating it — which is the whole reason this rerun exists.
#
# Shapes: n_features_per_batch 4096 x n_prompts_in_forward_pass 256 — the "4096x256" configuration
# that the benchmark wave found most efficient. Safe here where 262k needed 2048: the feature axis is
# 16x narrower (16,384 vs 262,144), so the per-feature-batch packaging working set is far below the
# GPU cliff documented in the 262k config.
pipeline:
  model_name: gemma-3-1b-it
  model_layers: 26
  creator_name: Google DeepMind
  release_id: gemma-scope-2
  release_title: Gemma Scope 2
  release_url: https://huggingface.co/google/gemma-scope-2-1b-it
  hook_point: hook_mlp_in
  # Where activations are actually captured. Set explicitly because these transcoders' declared
  # TransformerLens hook name is NOT the tensor they were trained on: Gemma Scope declares
  # `pre_feedforward_layernorm.output` (the block norm's output) while SAELens declares
  # `blocks.{layer}.hook_mlp_in`, the residual BEFORE that norm. Measured cos 0.088 apart on
  # gemma-3-1b-it layer 5; `blocks.{layer}.ln2.hook_out` matches the declared tensor at cos 1.000000
  # on a TransformerBridge. `hook_point` above stays as it is: it is the Neuronpedia source LABEL,
  # whose fixed vocabulary has no term for this tensor, so the two read differently by necessity and
  # the runner announces the divergence.
  capture_hook_name: blocks.{layer}.ln2.hook_out
  sae_set: gemma-scope-2-1b-it-transcoders-all
  neuronpedia_source_set_id: gemmascope-2-transcoder-16k
  neuronpedia_source_set_description: Transcoder - 16k
  # google/, NOT mwhanna/ — the mwhanna mirror has no per-layer directories
  # (`transcoder_all/width_16k_l0_big/...`), so the layer-templated path below resolves to nothing
  # there. Verified 2026-07-31: google/ has 3 files under transcoder_all/layer_9_width_16k_l0_small_affine/.
  hf_weights_repo_id: google/gemma-scope-2-1b-it
  hf_weights_path_template: transcoder_all/layer_{layer}_width_16k_l0_small_affine
  sae_path_template: layer_{layer}_width_16k_l0_small_affine
  prompts_huggingface_dataset_path: monology/pile-uncopyrighted
  prompts_huggingface_dataset_split: train
  start_layer: 0
  end_layer: 25
  start_batch: 0
  n_prompts_total: 4096
  n_tokens_in_prompt: 128
  n_features_per_batch: 4096
  n_prompts_in_forward_pass: 256
  use_skip_transcoder: true
  runner_dashboard_output_format: columnar
  runner_sequence_selection_backend: columnar_gpu
  runner_feature_statistics_backend: arrow
  runner_logits_histogram_backend: arrow
  runner_overlap_batch_packaging: true
  runner_use_cached_activations: false
  model_wrapper: bridge
  bridge_enable_compatibility_mode: true
  runner_log_resource_snapshots: true
  runner_log_performance: true
  import_to_local_db: true
  overlap_local_db_import: true
  # Keeps every layer's neuron-import payload under postgres' 256 MB single-jsonb-array limit; the
  # default 65000 trips ProgramLimitExceeded on dense layers and aborts the whole run.
  local_db_import_chunk_size: 16000
  # REQUIRED for inline import: without an explicit DB URL the pipeline logs one startup WARNING and
  # silently degrades to generation-only.
  local_db_url: postgres://postgres:postgres@127.0.0.1:5432/postgres
  archive_partial_dirs: false
  heartbeat_seconds: 60
  stall_timeout_seconds: 1800
  # No run_name_suffix: keeps the run dir canonical so _resolve_source_id derives canonical source ids
  # ({layer}-{set_id}) for inline imports.
launcher:
  background: true
  monitor: true
  monitor_heartbeat_seconds: 60
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
