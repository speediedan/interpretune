##########################################################################################
# Example module registry: demo-scale (`*.rte_demo.*`) entries usable outside the test
# suite. Every entry references only shipping classes (`it_examples.*` / `interpretune.*`)
# -- entries that depend on the `tests` package belong in `tests/module_registry.yaml`.
##########################################################################################
gpt2.rte_demo.sae_lens:
  reg_info:
    model_src_key: gpt2
    model_cfg_key: rte_demo
    adapter_combinations:
      - [core, sae_lens]
      - [lightning, sae_lens]
    description: TransformerBridge SAE Lens example, GPT2 with supported adapter compositions
  shared_config:
    task_name: rte
    model_name_or_path: gpt2
    tokenizer_id_overrides:
      pad_token_id: 50256
    tokenizer_kwargs:
      # TransformerBridge passes tokens directly to the underlying HF model, so
      # attention_mask must be in model_input_names for proper left-padding masking.
      model_input_names: ['input', 'attention_mask']
      padding_side: left
      add_bos_token: true
  registered_cfg:
    datamodule_cfg:
      prompt_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqPromptConfig
      # attention_mask must be in signature_columns so _remove_unused_columns preserves it.
      signature_columns: ['input', 'attention_mask', 'labels']
      text_fields: ["premise", "hypothesis"]
      enable_datasets_cache: True
      train_batch_size: 2
      eval_batch_size: 2
    module_cfg:
      class_path: interpretune.config.module.ITConfig
      init_args:
        auto_comp_cfg:
          class_path: interpretune.config.shared.AutoCompConfig
          init_args:
            module_cfg_name: RTEBoolqConfig
            module_cfg_mixin:
              class_path: it_examples.experiments.rte_boolq.RTEBoolqEntailmentMapping
              import_only: True
        generative_step_cfg:
          class_path: it_examples.experiments.rte_boolq.RTEBoolqGenerativeClassificationConfig
          init_args:
            enabled: True
            lm_generation_cfg:
              class_path: interpretune.config.transformer_lens.TLensGenerationConfig
              init_args:
                max_new_tokens: 1
        hf_from_pretrained_cfg:
          class_path: interpretune.config.mixins.HFFromPretrainedConfig
          init_args:
            pretrained_kwargs:
              device_map: cpu
              dtype: float32
            model_head: transformers.GPT2LMHeadModel
        tl_cfg:
          class_path: interpretune.config.transformer_lens.ITLensBridgeConfig
          init_args:
            model_name: gpt2-small
            default_padding_side: left
        sae_cfgs:
          - class_path: interpretune.config.sae_lens.SAELensFromPretrainedConfig
            init_args:
              release: gpt2-small-res-jb
              sae_id: blocks.0.hook_resid_pre
              device: cuda
          - class_path: interpretune.config.sae_lens.SAELensFromPretrainedConfig
            init_args:
              release: gpt2-small-res-jb
              sae_id: blocks.1.hook_resid_pre
              device: cuda
    datamodule_cls:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqDataModule
    module_cls:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqModule
gpt2.rte_demo.nnsight_sae_lens:
  reg_info:
    model_src_key: gpt2
    model_cfg_key: rte_demo
    adapter_combinations:
      - [core, nnsight, sae_lens]
    description: NNsight + SAE Lens demo example, GPT2 for NNsight backend demonstration
  shared_config:
    task_name: rte
    model_name_or_path: openai-community/gpt2
    tokenizer_id_overrides:
      pad_token_id: 50256
    tokenizer_kwargs:
      # NNsight uses HF models directly, so we keep standard HF input names
      model_input_names: ['input_ids', 'attention_mask']
      padding_side: left
      add_bos_token: true
  registered_cfg:
    datamodule_cfg:
      prompt_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqPromptConfig
      signature_columns: ['input_ids', 'attention_mask', 'labels']
      text_fields: ["premise", "hypothesis"]
      enable_datasets_cache: True
      train_batch_size: 2
      eval_batch_size: 2
    module_cfg:
      class_path: interpretune.config.sae_lens.SAELensConfig
      init_args:
        backend: nnsight
        auto_comp_cfg:
          class_path: interpretune.config.shared.AutoCompConfig
          init_args:
            module_cfg_name: RTEBoolqConfig
            module_cfg_mixin:
              class_path: it_examples.experiments.rte_boolq.RTEBoolqEntailmentMapping
              import_only: True
            target_adapters: nnsight
        generative_step_cfg:
          class_path: it_examples.experiments.rte_boolq.RTEBoolqGenerativeClassificationConfig
          init_args:
            enabled: True
            lm_generation_cfg:
              class_path: interpretune.config.mixins.HFGenerationConfig
              init_args:
                model_config:
                  max_new_tokens: 1
                  output_logits: true
                  return_dict_in_generate: true
        hf_from_pretrained_cfg:
          class_path: interpretune.config.mixins.HFFromPretrainedConfig
          init_args:
            pretrained_kwargs:
              device_map: cuda
              dtype: float32
            model_head: transformers.GPT2LMHeadModel
        nnsight_cfg:
          class_path: interpretune.config.nnsight.NNsightConfig
          init_args:
            model_name: openai-community/gpt2
            device_map: cuda
            torch_dtype: float32
            dispatch: true
            tokenizer_kwargs:
              padding_side: left
              add_bos_token: true
        sae_cfgs:
          - class_path: interpretune.config.sae_lens.SAELensFromPretrainedConfig
            init_args:
              release: gpt2-small-res-jb
              sae_id: blocks.0.hook_resid_pre
              device: cuda
          - class_path: interpretune.config.sae_lens.SAELensFromPretrainedConfig
            init_args:
              release: gpt2-small-res-jb
              sae_id: blocks.1.hook_resid_pre
              device: cuda
    datamodule_cls:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqDataModule
    module_cls:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqModule
gemma3.rte_demo.circuit_tracer_w_neuronpedia:
  reg_info:
    model_src_key: gemma3
    model_cfg_key: rte
    adapter_combinations:
      - [core, nnsight, circuit_tracer]
      - [lightning, nnsight, circuit_tracer]
    description: Circuit Tracer Example with NNsight backend, Gemma3-1b-it, and Neuronpedia upload enabled
  shared_config:
    task_name: rte
    os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
    model_name_or_path: google/gemma-3-1b-it
    tokenizer_kwargs:
        model_input_names: ['input']
        padding_side: left
        add_bos_token: true
  registered_cfg:
    datamodule_cfg:
      prompt_cfg:
        class_path: it_examples.example_prompt_configs.RTEBoolqGemmaPromptConfig
      signature_columns: ['input', 'labels']
      text_fields: ["premise", "hypothesis"]
      enable_datasets_cache: False
      train_batch_size: 2
      eval_batch_size: 2
    module_cfg:
      class_path: interpretune.config.module.ITConfig
      init_args:
        auto_comp_cfg:
          class_path: interpretune.config.shared.AutoCompConfig
          init_args:
            module_cfg_name: RTEBoolqConfig
            module_cfg_mixin:
              class_path: it_examples.experiments.rte_boolq.RTEBoolqEntailmentMapping
              import_only: True
        generative_step_cfg:
          class_path: it_examples.experiments.rte_boolq.RTEBoolqGenerativeClassificationConfig
          init_args:
            enabled: True
            lm_generation_cfg:
              class_path: interpretune.config.mixins.HFGenerationConfig
              init_args:
                model_config:
                  max_new_tokens: 1
                  output_logits: true
                  return_dict_in_generate: true
        hf_from_pretrained_cfg:
          class_path: interpretune.config.mixins.HFFromPretrainedConfig
          init_args:
            pretrained_kwargs:
              device_map: cpu
              dtype: float32
            model_head: transformers.Gemma3ForCausalLM
        circuit_tracer_cfg:
          class_path: interpretune.config.circuit_tracer.CircuitTracerConfig
          init_args:
            backend: "nnsight"
            transcoder_set: "mwhanna/gemma-scope-2-1b-it/transcoder_all/width_16k_l0_small_affine"
            max_n_logits: 10
            analysis_target_tokens: ['▁Dallas','▁Austin']
            desired_logit_prob: 0.95
            max_feature_nodes: 8192
            batch_size: 256
            offload: 'cpu'
            verbose: true
            use_neuronpedia: true
        neuronpedia_cfg:
          class_path: interpretune.extensions.neuronpedia.NeuronpediaConfig
          init_args:
            enabled: true
            auto_transform: true
            default_metadata:
              info:
                creator_name: "interpretune-user"
                creator_url: "https://github.com/speediedan/interpretune"
                generator:
                  name: "Interpretune Circuit Tracer Example"
                  version: "0.1.0.dev0"
                  url: "https://github.com/speediedan/interpretune"
                neuronpedia_model: "gemma-3-1b-it"
                neuronpedia_source_set: "gemmascope-2-transcoder-16k"
              feature_details:
                neuronpedia_source_set: "gemmascope-2-transcoder-16k"
    datamodule_cls:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqDataModule
    module_cls:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqModule
