# interpretune component manifest (schema v1)
# A task-neutral component for analyses of free-form prompts (interpretune#1013). The model-only configurations set no
# prompts and no attribution targets; experiment variants that need them are named for the experiment. Unlike
# speediedan/rte, the entrypoint lives in this tree, so one source holds everything the component publishes.
it_schema_version: 1
kinds:
- module
requires:
  # dev floor until the alpha releases (PEP 440: 0.1.0.devN sorts BEFORE 0.1a0); tighten to '>=0.1a0' at release
  interpretune: '>=0.1.dev0'
  adapters:
  - circuit_tracer
  - nnsight
  pip: []
module:
  entrypoint: prompt_analysis.py
  task:
    name: prompt_analysis
    description: Analyses of free-form prompts, with no dataset and no task head
    datasets: []
    external_data: []
    variants:
      prompt_analysis:
        description: model and adapter composition only; the caller supplies prompts and, if wanted, targets
  configs:
    prompt_analysis.gemma2.circuit_tracer+nnsight: configs/prompt_analysis.gemma2.circuit_tracer+nnsight.yaml
