# Model specs for interpretune's experiment sessions: pass this file as `model_specs` to
# `interpretune.harness.sessions.experiment_session` with `model_family="inkling2"` and the variant below. Inkling 2
# Mini's top-level configuration is registered only for `image-text-to-text`, so the nnsight task is named; with the
# default (`text-generation`) the model cannot be built.
model_specs:
  # NDIF: no local weights (meta tensors), one remote trace per read
  inkling2.mini_ndif:
    model_name: thinkingmachines/Inkling-2-Mini
    transcoder_set: ""
    neuronpedia_model: ""
    neuronpedia_set: ""
    use_chat_template: true
    composition: [core, nnsight]
    module_cls: interpretune.harness.sessions.ReadoutModule
    nnsight_overrides:
      model_name: "{model_name}"
      task: image-text-to-text
      device_map: cpu
      torch_dtype: bfloat16
      dispatch: false
      remote: true
  # local: the weights loaded in bf16 and placed across the visible GPUs
  inkling2.mini:
    model_name: thinkingmachines/Inkling-2-Mini
    transcoder_set: ""
    neuronpedia_model: ""
    neuronpedia_set: ""
    use_chat_template: true
    composition: [core, nnsight]
    module_cls: interpretune.harness.sessions.ReadoutModule
    nnsight_overrides:
      model_name: "{model_name}"
      task: image-text-to-text
      device_map: auto
      torch_dtype: bfloat16
      dispatch: true
