# A looped lens for Inkling 2 Mini as a venngram address book: the best majority configuration under item
# cross-validation on the pool of sites that run on NDIF (P2: item-CV 0.954, multihop 1.00, leave one family out
# 0.805; held out 31 of 33), K=10, no filter. Its two coda readouts are pass-3 visits at layers 14 and 15, which the
# runtime reads remotely as extra batch rows of one trace (layer 17's pass-3 output patched to the visit's active
# block); the other four are plain readouts.
schema_version: 12
name: inkling2-mini-looped-lens-icv-coda-remote-k10-n6
description: Read sites of a six-site looped lens for Inkling 2 Mini (two coda readouts, four plain; runs remotely).
portability: family
applies_to: {architectures: [Inkling2LoopForConditionalGeneration]}
sets:
  l15p3: "point:state.active & layers:15 & passes:3"
  l19: "point:state.active & layers:19"
  l14p3: "point:state.active & layers:14 & passes:3"
  l18_moe: "point:mlp.mix & layers:18"
  l22: "point:state.active & layers:22"
  l21: "point:state.active & layers:21"
lens:
  model: thinkingmachines/Inkling-2-Mini
  K: 10
  variant: plain
  filters: []
  readouts:
    - {set: l15p3, readout: coda}
    - {set: l19, readout: plain}
    - {set: l14p3, readout: coda}
    - {set: l18_moe, readout: plain}
    - {set: l22, readout: plain}
    - {set: l21, readout: plain}
