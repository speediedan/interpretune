# The looped lens the Looped Lens Challenge entry v2 submits: inkling2_mini_icv_coda_remote_k10_n6 with two sites
# read at the end of the question rather than at the read position. The challenge reads chat questions at
# <|message_model|>, where the model is about to format its answer; at the question's last "?" token it still holds
# the answer. Chosen on a candidate pool collected on NDIF in the challenge's own format and scored by its voting rule
# (one vote per readout, for the highest-ranked option it names): on 79 basic-readout items 0.722 exact / 0.848 alias
# against 0.468 / 0.608 for the read-position book; multihop (plain prompts, where the question end is the read
# position) unchanged. K=10, no filter.
schema_version: 12
name: inkling2-mini-looped-lens-qend-coda-remote-k10-n6
description: Read sites of a six-site looped lens for Inkling 2 Mini, two of them read at the question's end (runs remotely).
portability: family
applies_to: {architectures: [Inkling2LoopForConditionalGeneration]}
sets:
  l14p3: "point:state.active & layers:14 & passes:3"
  l15p3: "point:state.active & layers:15 & passes:3"
  l18_moe: "point:mlp.mix & layers:18"
  l19: "point:state.active & layers:19"
  l21: "point:state.active & layers:21"
  l22_moe: "point:mlp.mix & layers:22"
lens:
  model: thinkingmachines/Inkling-2-Mini
  K: 10
  variant: plain
  filters: []
  readouts:
    - {set: l14p3, readout: coda}
    - {set: l15p3, readout: coda}
    - {set: l18_moe, readout: plain}
    - {set: l19, readout: plain}
    - {set: l21, readout: plain, position: question_end}
    - {set: l22_moe, readout: plain, position: question_end}
