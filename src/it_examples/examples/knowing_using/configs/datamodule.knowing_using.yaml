# Standalone-consumption default for the knowing_using datamodule (module configurations inline their own): the
# paper's 1,000-fact Qwen2.5 sample. `data_path` must name the paper's `chaining_tasks.json`.
datamodule_cls:
  class_path: knowing_using.KUGDataModule
datamodule_cfg:
  class_path: knowing_using.KUGDataModuleConfig
  init_args:
    data_path: null
    fact_seed: 848
    n_memorization: 1000
    prompt_cfg:
      class_path: knowing_using.KUGPromptConfig
    train_batch_size: 10
    eval_batch_size: 64
shared_config:
  task_name: knowing_using
  model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  tokenizer_kwargs:
    revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
