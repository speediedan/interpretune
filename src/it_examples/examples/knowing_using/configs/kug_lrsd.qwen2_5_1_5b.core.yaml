# Derived key: kug_lrsd.qwen2_5_1_5b.core
# The Knowing-Using Gap's LRSD recipe on Qwen2.5-1.5B-Instruct (Table 9 of Dai et al.): LoRA (r 8, alpha 32, dropout
# 0.05) on every block's projections over fp32 weights, AdamW at 1e-4 (weight decay 0.01), batch 10, gradient norm
# clipped to 1, completion cross-entropy plus `lrsd_lambda` times the relative MSE between block 14's head-entity
# state and block 21's (stop-gradient). `lrsd_lambda: 0.0` is the plain cross-entropy arm. Greedy 64-token generation
# scores the unique two-hop and single-hop questions by exact match after every epoch. `runs/kug_lrsd.qwen2_5_1_5b.core
# .yaml` runs it on the core loop (bf16 autocast) for 50 epochs. The data is the paper's `chaining_tasks.json`,
# downloaded from the Hub dataset `speediedan/knowing-using-gap-chaining` at a pinned revision; `data_path` names a
# local copy instead.
task_variant: kug_lrsd
model: qwen2_5_1_5b
composition: []
extensions: []
descriptor: null
reg_info:
  model_src_key: qwen2_5_1_5b
  model_cfg_key: kug_lrsd
  adapter_combinations:
    - core
  description: Knowing-Using Gap LRSD recipe (LoRA, CE plus layer-wise self-distillation) on Qwen2.5-1.5B-Instruct
shared_config:
  task_name: knowing_using
  model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  tokenizer_kwargs:
    revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
registered_cfg:
  datamodule_cfg:
    class_path: knowing_using.KUGDataModuleConfig
    init_args:
      data_repo_id: speediedan/knowing-using-gap-chaining
      data_filename: chaining_tasks.json
      data_revision: a1bb9cee0bb47bc956df037a8e013a4350d127db
      data_path: null
      fact_seed: 848
      n_memorization: 1000
      prompt_cfg:
        class_path: knowing_using.KUGPromptConfig
      train_batch_size: 10
      eval_batch_size: 64
  module_cfg:
    class_path: knowing_using.KUGLRSDConfig
    init_args:
      lrsd_lambda: 1.0
      lrsd_student_layer: 14
      lrsd_teacher_layer: 21
      grad_clip_norm: 1.0
      generative_step_cfg:
        class_path: interpretune.config.mixins.GenerativeClassificationConfig
        init_args:
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              # greedy; every other generation setting stays the checkpoint's own
              model_config:
                do_sample: false
                max_new_tokens: 64
                use_cache: true
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            device_map: cuda
            dtype: float32
            revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          model_head: transformers.Qwen2ForCausalLM
          lora_cfg:
            r: 8
            lora_alpha: 32
            lora_dropout: 0.05
            target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
            task_type: CAUSAL_LM
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          lr: 1.0e-04
          weight_decay: 0.01
  datamodule_cls:
    class_path: knowing_using.KUGDataModule
  module_cls:
    class_path: knowing_using.KUGModule
