# interpretune component manifest (schema v1)
# In-repo tree mirrors the Hub tree; scripts/publish_it_module.py copies it and adds the generated card.
it_schema_version: 1
kinds:
- module
- datamodule
requires:
  # dev floor until the alpha releases (PEP 440: 0.1.0.devN sorts BEFORE 0.1a0); tighten to '>=0.1a0' at release
  interpretune: '>=0.1.dev0'
  adapters: []
  pip:
  - peft
  - finetuning-scheduler
module:
  entrypoint: knowing_using.py
  task:
    name: knowing_using
    description: >-
      The Knowing-Using Gap (Dai et al., arXiv 2607.08393): models fine-tuned on single-hop biomedical facts memorize
      them yet fail the two-hop questions they compose into; layer-wise representation self-distillation (LRSD)
      narrows the gap
    datasets:
    - path: speediedan/knowing-using-gap-chaining
      revision: a1bb9cee0bb47bc956df037a8e013a4350d127db
      data_files: chaining_tasks.json
      sha256: 7ea065e4e3ddaa0f6ee100695961ddf8f9a9581938e5b6127168858718598d5d
      license: mit
      description: >-
        The paper's chaining tasks (11,997 items, each two single-hop facts with their questions and one two-hop
        question), derived from the STaRK benchmark over the PrimeKG knowledge graph and released under MIT with the
        paper's code, published unchanged in this dataset. The datamodule downloads the file at this revision unless
        `data_path` names a local copy, and samples 1,000 facts from it with the fact seed (848 for Qwen2.5).
    external_data: []
    variants:
      kug_lrsd:
        description: LoRA fine-tuning with cross-entropy plus LRSD (`lrsd_lambda` 0 is the plain arm), scored by
          exact match after every epoch on the core loop (runs/)
  configs:
    kug_lrsd.llama3_2_1b.core: configs/kug_lrsd.llama3_2_1b.core.yaml
    kug_lrsd.llama3_2_3b.core: configs/kug_lrsd.llama3_2_3b.core.yaml
    kug_lrsd.qwen2_5_1_5b.core: configs/kug_lrsd.qwen2_5_1_5b.core.yaml
datamodules:
  knowing_using:
    entrypoint: knowing_using.py
    config: configs/datamodule.knowing_using.yaml
# files the component ships for its users: the finetuning-scheduler schedule and the CLI run configuration
# (`interpretune --config hub://speediedan/knowing-using/runs/<file>`)
extra_files:
- ft_schedules
- runs
