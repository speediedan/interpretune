# #931 Part 2, phases as experimental stages (a draft: the gate's threshold and the mid band await a design ruling).
# Phase 0 trains every block's LoRA adapters on cross-entropy alone. `MetricThresholdTransition` (configured in the run)
# opens phase 1 in the epoch memorization (`mem_em`) first reaches 0.9: phase 1 refreezes the adapters outside the mid
# band, blocks 7 to 20 of 28 (0.25L to 0.75L), and `PhaseLRSD` turns the LRSD term on. Named by regex, as
# PEFT names an interpretune module's adapters (`model.` is the PEFT-wrapped HF model).
0:
  params:
  - model\..*\.lora_[AB]\..*
  phase_config:
    lrsd_lambda: 0.0
1:
  params: []
  refreeze:
  - model\..*\.layers\.(?:[0-6]|2[1-7])\..*\.lora_[AB]\..*
  phase_config:
    lrsd_lambda: 1.0
