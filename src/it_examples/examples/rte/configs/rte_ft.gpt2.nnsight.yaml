# Derived key: rte_ft.gpt2.nnsight
# `rte_ft.gpt2.core` on a local, dispatched nnsight composition, for the address-schedule example:
# `runs/rte_ft.gpt2.nnsight.yaml` runs `ft_schedules/rte_ft.gpt2.addresses.yaml` on it, the same schedule
# `runs/rte_ft.gpt2.transformer_lens.yaml` runs on TransformerLens. Its tunable view is venngram's view of the HF model
# nnsight dispatches, registered as `hf_model`.
task_variant: rte_ft
model: gpt2
composition: [nnsight]
extensions: []
descriptor: null
reg_info:
  model_src_key: gpt2
  model_cfg_key: rte_ft
  adapter_combinations:
    - [core, nnsight]
  description: Phased fine-tuning of GPT2 on a local nnsight composition, scheduled by venngram address (CPU-sized)
shared_config:
  task_name: rte
  model_name_or_path: gpt2
  tokenizer_id_overrides:
    pad_token_id: 50256
  tokenizer_kwargs:
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqPromptConfig
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 4
    eval_batch_size: 4
    prepare_data_map_cfg:
      batched: true
      batch_size: 4
  module_cfg:
    class_path: interpretune.adapters.nnsight.config.ITNNsightConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: true
          target_adapters: nnsight
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              model_config:
                max_new_tokens: 1
                output_logits: true
                return_dict_in_generate: true
      nnsight_cfg:
        class_path: interpretune.adapters.nnsight.config.NNsightConfig
        init_args:
          model_name: gpt2
          device_map: cpu
          torch_dtype: float32
          dispatch: true
          tokenizer_kwargs:
            padding_side: left
            add_bos_token: true
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 0.0
          lr: 3.0e-05
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
