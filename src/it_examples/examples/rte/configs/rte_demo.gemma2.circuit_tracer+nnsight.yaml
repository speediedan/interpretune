# Derived key: rte_demo.gemma2.circuit_tracer+nnsight  (was: gemma2.rte_demo.circuit_tracer_nnsight)
task_variant: rte_demo
model: gemma2
composition: [circuit_tracer, nnsight]
extensions: []
descriptor: null
reg_info:
  model_src_key: gemma2
  model_cfg_key: rte
  adapter_combinations:
    - [core, nnsight, circuit_tracer]
    - [lightning, nnsight, circuit_tracer]
  description: Circuit Tracer RTE demo with NNsight backend, Gemma2-2b (non-instruction tuned)
shared_config:
  task_name: rte
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  model_name_or_path: google/gemma-2-2b
  tokenizer_kwargs:
      model_input_names: ['input']
      padding_side: left
      add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: it_examples.experiments.rte_boolq.RTEBoolqPromptConfig
    signature_columns: ['input', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: False
    train_batch_size: 2
    eval_batch_size: 2
  module_cfg:
    class_path: interpretune.config.nnsight.ITNNsightConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: it_examples.experiments.rte_boolq.RTEBoolqEntailmentMapping
            import_only: True
      generative_step_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: True
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              model_config:
                max_new_tokens: 3
                output_logits: true
                return_dict_in_generate: true
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            device_map: cpu
            dtype: float32
          model_head: transformers.Gemma2ForCausalLM
      nnsight_cfg:
        class_path: interpretune.config.nnsight.NNsightConfig
        init_args:
          model_name: google/gemma-2-2b
          device_map: cuda
          torch_dtype: float32
          dispatch: true
          attn_implementation: eager
          tokenizer_kwargs:
            padding_side: left
            add_bos_token: true
      circuit_tracer_cfg:
        class_path: interpretune.config.circuit_tracer.CircuitTracerConfig
        init_args:
          backend: "nnsight"
          transcoder_set: "gemma"
          max_n_logits: 10
          analysis_target_tokens: ['▁Dallas','▁Austin']
          desired_logit_prob: 0.95
          max_feature_nodes: 8192
          batch_size: 256
          offload: 'cpu'
          verbose: true
          use_neuronpedia: false
  datamodule_cls:
    class_path: it_examples.experiments.rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: it_examples.experiments.rte_boolq.RTEBoolqModule
