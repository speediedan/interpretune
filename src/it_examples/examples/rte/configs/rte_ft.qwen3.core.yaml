# Derived key: rte_ft.qwen3.core
# Qwen3-0.6B on RTE through the core loop, in fp32 on one GPU: the model of the neuron-finder example (interpretune#869),
# which screens its MLP neurons for the answer, steers with them and tunes them. The chat template is rendered with
# thinking disabled, so the answer position holds the Yes or No token rather than the start of a reasoning block.
task_variant: rte_ft
model: qwen3
composition: []
extensions: []
descriptor: null
reg_info:
  model_src_key: qwen3
  model_cfg_key: rte_ft
  adapter_combinations:
    - core
  description: Qwen3-0.6B on RTE on the core loop (one GPU), with finetuning-scheduler for staged tuning
shared_config:
  task_name: rte
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  model_name_or_path: Qwen/Qwen3-0.6B
  tokenizer_kwargs:
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqChatTemplatePromptConfig
      init_args:
        chat_template_kwargs:
          enable_thinking: false
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 8
    eval_batch_size: 8
    # tokenize (and pad) in chunks of one batch: unshuffled batches are then padded to their own longest prompt, not
    # to the longest of 1,000
    prepare_data_map_cfg:
      batched: true
      batch_size: 8
  module_cfg:
    class_path: interpretune.config.module.ITConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: true
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              model_config:
                max_new_tokens: 1
                output_logits: true
                return_dict_in_generate: true
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            device_map: cuda
            dtype: float32
            attn_implementation: eager
          model_head: transformers.Qwen3ForCausalLM
      # the loss reads only the answer position (the last, with left padding): skip the other positions' logits
      cust_fwd_kwargs:
        logits_to_keep: 1
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 0.0
          lr: 1.0e-05
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
