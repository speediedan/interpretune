# Derived key: rte_ft.gpt2.transformer_lens
# `rte_ft.gpt2.core` on a TransformerLens composition, for the address-schedule example: `runs/rte_ft.gpt2.transformer_lens.yaml`
# runs `ft_schedules/rte_ft.gpt2.addresses.yaml` on it, the same schedule `runs/rte_ft.gpt2.nnsight.yaml` runs on nnsight.
# The bridge holds GPT-2's own weights (no LayerNorm folding or centering), so both compositions tune the same tensors,
# and its tunable view thaws only what the schedule names (`implicit_norm_thaw: false`), as the other compositions' views
# do; with the default, thawing any tensor of a block would also thaw that block's norms on this composition alone.
task_variant: rte_ft
model: gpt2
composition: [transformer_lens]
extensions: []
descriptor: null
reg_info:
  model_src_key: gpt2
  model_cfg_key: rte_ft
  adapter_combinations:
    - [core, transformer_lens]
  description: Phased fine-tuning of GPT2 on a TransformerLens composition, scheduled by venngram address (CPU-sized)
shared_config:
  task_name: rte
  model_name_or_path: gpt2
  tokenizer_id_overrides:
    pad_token_id: 50256
  tokenizer_kwargs:
    model_input_names: ['input']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqPromptConfig
    signature_columns: ['input', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 4
    eval_batch_size: 4
    prepare_data_map_cfg:
      batched: true
      batch_size: 4
  module_cfg:
    class_path: interpretune.config.module.ITConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: true
          target_adapters: transformer_lens
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.adapters.transformer_lens.config.TLensGenerationConfig
            init_args:
              max_new_tokens: 1
              output_logits: true
              return_dict_in_generate: true
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            device_map: cpu
            dtype: float32
          model_head: transformers.GPT2LMHeadModel
      tl_cfg:
        class_path: interpretune.adapters.transformer_lens.config.ITLensFromPretrainedNoProcessingConfig
        init_args:
          device: cpu
      tunable_view:
        class_path: interpretune.adapters.transformer_lens.tunable_view.TransformerBridgeView
        init_args:
          implicit_norm_thaw: false
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 0.0
          lr: 3.0e-05
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
