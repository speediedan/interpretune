# Derived key: rte_demo.gemma3.circuit_tracer+nnsight.fsdp2
# gemma-3-4b-it with every layer's Gemma Scope 2 transcoder (16k features), circuit-tracer over nnsight, shaped to be
# sharded with FSDP2: the transcoders load eagerly (a lazily loaded weight is read from disk rather than held as a
# parameter, so it could not be sharded), the nnsight model has no `device_map`, and the test step runs the model's
# forward rather than `generate` (generation calls the Hugging Face module directly, so it would become the FSDP2 root).
# `runs/rte_test.gemma3_4b.circuit_tracer.fsdp2.yaml` runs its RTE test loop on two ranks, built on the meta device. The
# same configuration also runs in one process on one 24 GB GPU (bf16), which is the reference the sharded run is
# compared with.
task_variant: rte_demo
model: gemma3
composition: [circuit_tracer, nnsight]
extensions: []
descriptor: fsdp2
reg_info:
  model_src_key: gemma3
  model_cfg_key: rte
  adapter_combinations:
    - [core, nnsight, circuit_tracer]
  description: Circuit Tracer over NNsight with Gemma3-4b-it and Gemma Scope 2 transcoders, shaped for FSDP2 sharding
shared_config:
  task_name: rte
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  model_name_or_path: google/gemma-3-4b-it
  tokenizer_kwargs:
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqChatTemplatePromptConfig
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 4
    eval_batch_size: 4
    prepare_data_map_cfg:
      batched: true
  module_cfg:
    class_path: interpretune.adapters.nnsight.config.ITNNsightConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: True
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: False
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            dtype: bfloat16
          model_head: transformers.Gemma3ForConditionalGeneration
      nnsight_cfg:
        class_path: interpretune.adapters.nnsight.config.NNsightConfig
        init_args:
          model_name: google/gemma-3-4b-it
          torch_dtype: bfloat16
          dispatch: true
          attn_implementation: eager
          tokenizer_kwargs:
            padding_side: left
            add_bos_token: true
      circuit_tracer_cfg:
        class_path: interpretune.adapters.circuit_tracer.config.CircuitTracerConfig
        init_args:
          backend: "nnsight"
          transcoder_set: "mwhanna/gemma-scope-2-4b-it/transcoder_all/width_16k_l0_small_affine"
          lazy_encoder: false
          lazy_decoder: false
          max_n_logits: 10
          desired_logit_prob: 0.95
          max_feature_nodes: 8192
          batch_size: 256
          verbose: true
          use_neuronpedia: false
      # materialized example defaults
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 1.0e-06
          eps: 1.0e-07
          lr: 3.0e-05
      lr_scheduler_init:
        class_path: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
        init_args:
          T_0: 1
          T_mult: 2
          eta_min: 1.0e-06
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
