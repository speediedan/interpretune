# Derived key: rte_ft.qwen3.nnsight
# `rte_ft.qwen3.core` through a local, dispatched nnsight `LanguageModel` (interpretune#812): the same steered, phased
# fine-tuning of Qwen3-0.6B on RTE. The nnsight model's HF module is registered on the interpretune module as
# `hf_model`, so the steering vector sits on `hf_model.model.layers.13` and the schedule
# (`ft_schedules/rte_ft.qwen3.nnsight.yaml`) names the HF module's own parameters under `hf_model.`.
# `runs/rte_ft.qwen3.nnsight.core.yaml` and `runs/rte_ft.qwen3.nnsight.lightning.yaml` run it on the core loop and on
# Lightning from the CLI. fp32; one 24 GB GPU.
task_variant: rte_ft
model: qwen3
composition: [nnsight]
extensions: []
descriptor: null
reg_info:
  model_src_key: qwen3
  model_cfg_key: rte_ft
  adapter_combinations:
    - [core, nnsight]
    - [lightning, nnsight]
  description: Steered, phased fine-tuning of Qwen3-0.6B through nnsight, core loop or Lightning (one GPU)
shared_config:
  task_name: rte
  model_name_or_path: Qwen/Qwen3-0.6B
  tokenizer_kwargs:
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqPromptConfig
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 8
    eval_batch_size: 8
    dataloader_kwargs:
      drop_last: true
    # tokenize (and pad) in chunks of one batch: unshuffled batches are then padded to their own longest prompt, not to
    # the longest of 1,000
    prepare_data_map_cfg:
      batched: true
      batch_size: 8
  module_cfg:
    class_path: interpretune.adapters.nnsight.config.ITNNsightConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: true
          target_adapters: nnsight
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              model_config:
                max_new_tokens: 1
                output_logits: true
                return_dict_in_generate: true
      # local and dispatched, so the weights are on the device for the optimizer to step
      nnsight_cfg:
        class_path: interpretune.adapters.nnsight.config.NNsightConfig
        init_args:
          model_name: Qwen/Qwen3-0.6B
          device_map: cuda
          torch_dtype: float32
          dispatch: true
          tokenizer_kwargs:
            padding_side: left
      # a steering vector on the residual stream after decoder layer 13 (of 28), declared `intervention:steer`; it
      # starts at zero, so the steered model starts out identical to the pretrained one
      tuning_interventions:
        - name: steer
          site: hf_model.model.layers.13
      # phase 0's learning rate, the steering vector's: one direction takes a far larger step than a block does (the
      # block phases set their own `lr`)
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 0.0
          lr: 1.0e-03
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
