# Derived key: rte_demo.gpt2.core
task_variant: rte_demo
model: gpt2
composition: []
extensions: []
descriptor: null
reg_info:
  model_src_key: gpt2
  model_cfg_key: rte_demo
  adapter_combinations:
    - core
    - lightning
  description: CPU-only core example, GPT2 with supported adapter compositions (no
    SAE latents)
shared_config:
  task_name: rte
  model_name_or_path: gpt2
  tokenizer_id_overrides:
    pad_token_id: 50256
  tokenizer_kwargs:
    # A core composition forwards to the HF model itself, which takes `input_ids`; `input` is the TransformerLens
    # bridge convention and makes every direct forward (any Trainer loop) fail. The analysis ops resolve either name.
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqPromptConfig
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 2
    eval_batch_size: 2
    prepare_data_map_cfg:
      batched: true
  module_cfg:
    class_path: interpretune.config.module.ITConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: true
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              model_config:
                max_new_tokens: 1
                output_logits: true
                return_dict_in_generate: true
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            device_map: cpu
            dtype: float32
          model_head: transformers.GPT2LMHeadModel
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 1.0e-06
          eps: 1.0e-07
          lr: 3.0e-05
      lr_scheduler_init:
        class_path: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
        init_args:
          T_0: 1
          T_mult: 2
          eta_min: 1.0e-06
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
