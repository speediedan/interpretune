# The sparsity chain's two phases for GPT-2 small (CPU-sized; `rte_sparse.gemma3.yaml` is the research schedule).
# Phase 0 (sparsity) thaws the final norm and blocks 9-11 with the penalty on; phase 1 (recovery) keeps them thawed
# with a fresh optimizer and the boundary's simplified graph enforced. `phase_config` is the payload the component's
# `ChainApplyPayload` start hook applies.
0:
  params:
  - model.transformer.ln_f.*
  - model.transformer.h.(9|10|11)\..*
  max_transition_epoch: 1
  phase_config: {reg_weight: 0.3, err_weight: 3.0, enforce: false}
1:
  params: []
  new_optimizer:
    optimizer_init:
      class_path: torch.optim.AdamW
      init_args: {weight_decay: 0.0, lr: 3.0e-05}
  phase_config: {reg_weight: 0.3, err_weight: 3.0, enforce: true}
