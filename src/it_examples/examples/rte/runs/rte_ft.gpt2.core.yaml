# Phased fine-tuning (finetuning-scheduler) of GPT-2 on RTE, small enough for a CPU, on interpretune's core loop:
#
#   interpretune --run_command train --config hub://speediedan/rte/runs/rte_ft.gpt2.core.yaml
#
# The session is the component's `rte_ft.gpt2.core` configuration and the schedule is `ft_schedules/rte_ft.gpt2.yaml`,
# run through every phase (`max_depth: -1`). `FTSCoreCallback` drives finetuning-scheduler's `TuningScheduler`: a phase
# advances on a validation-loss plateau (or at its `max_transition_epoch`), and the best checkpoint by validation loss
# is kept. `runs/rte_ft.gpt2.lightning.yaml` is the same run on the Lightning interface.
session_ref: speediedan/rte:rte_ft.gpt2.core
seed_everything: 0
run_cfg:
  max_epochs: 10
  callbacks:
    - class_path: interpretune.tuning.core_loop.FTSCoreCallback
      init_args:
        schedule: hub://speediedan/rte/ft_schedules/rte_ft.gpt2.yaml
        tuning_scheduler_kwargs:
          max_depth: -1
          transition:
            class_path: finetuning_scheduler.core.transitions.PlateauTransition
            init_args:
              monitor: val_loss
              patience: 1
              min_delta: 0.001
          checkpoint:
            class_path: finetuning_scheduler.core.checkpoint.BestCheckpoint
            init_args:
              dirpath: checkpoints/rte_ft.gpt2.core
              monitor: val_loss
