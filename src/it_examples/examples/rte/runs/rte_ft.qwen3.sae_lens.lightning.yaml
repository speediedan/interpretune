# Phased fine-tuning (finetuning-scheduler) of Qwen3-0.6B on RTE beside a frozen SAE Lens transcoder, steered first
# (interpretune#812), fp32 on one 24 GB GPU, on the Lightning interface:
#
#   interpretune --lightning_cli fit --config hub://speediedan/rte/runs/rte_ft.qwen3.sae_lens.lightning.yaml
#
# The same session, schedule and policies as `runs/rte_ft.qwen3.sae_lens.core.yaml`, through Lightning's callbacks: the
# `FinetuningScheduler` callback with `FTSEarlyStopping` (a phase advances on a validation-loss plateau) and
# `FTSCheckpoint` (the best checkpoint by validation loss), run through every phase (`max_depth: -1`).
session_ref: speediedan/rte:rte_ft.qwen3.sae_lens
adapter_ctx:
  - lightning
  - sae_lens
seed_everything: 0
trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 10
  num_sanity_val_steps: 0
  logger: false
  enable_progress_bar: false
  callbacks:
    - class_path: finetuning_scheduler.FinetuningScheduler
      init_args:
        ft_schedule: hub://speediedan/rte/ft_schedules/rte_ft.qwen3.transformer_lens.yaml
        max_depth: -1
    - class_path: finetuning_scheduler.FTSEarlyStopping
      init_args:
        monitor: val_loss
        patience: 1
        min_delta: 0.001
    - class_path: finetuning_scheduler.FTSCheckpoint
      init_args:
        dirpath: checkpoints/rte_ft.qwen3.sae_lens.lightning
        monitor: val_loss
        save_top_k: 1
