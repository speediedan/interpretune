# interpretune component manifest (schema v1) — see the hub-integration design (ACCEPTED v2)
# In-repo tree mirrors the Hub tree; scripts/publish_it_module.py copies + adds the generated card.
it_schema_version: 1
kinds:
- module
- datamodule
requires:
  # dev floor until the alpha releases (PEP 440: 0.1.0.devN sorts BEFORE 0.1a0, so an alpha floor
  # would reject every dev/CI build); tighten to '>=0.1a0' at release
  interpretune: '>=0.1.dev0'
  adapters:
  - lightning
  - transformer_lens
  - sae_lens
  - circuit_tracer
  - nnsight
  pip: []
module:
  entrypoint: rte_boolq.py
  task:
    name: rte
    description: SuperGLUE Recognizing Textual Entailment
    datasets:
    - path: aps/super_glue
      config_name: rte
      splits:
        train: train
        validation: validation
    external_data: []
    variants:
      rte_demo:
        description: demo-scale prompting flavor used by the example notebooks
      rte_ft:
        description: phased fine-tuning with finetuning-scheduler, on the core loop or Lightning (runs/)
  configs:
    rte_demo.gemma2.circuit_tracer: configs/rte_demo.gemma2.circuit_tracer.yaml
    rte_demo.gemma2.circuit_tracer+nnsight: configs/rte_demo.gemma2.circuit_tracer+nnsight.yaml
    rte_demo.gemma2.circuit_tracer.neuronpedia: configs/rte_demo.gemma2.circuit_tracer.neuronpedia.yaml
    rte_demo.gemma3.circuit_tracer.neuronpedia: configs/rte_demo.gemma3.circuit_tracer.neuronpedia.yaml
    rte_demo.gpt2.core: configs/rte_demo.gpt2.core.yaml
    rte_demo.gpt2.nnsight+sae_lens: configs/rte_demo.gpt2.nnsight+sae_lens.yaml
    rte_demo.gpt2.sae_lens: configs/rte_demo.gpt2.sae_lens.yaml
    rte_ft.gemma3.core: configs/rte_ft.gemma3.core.yaml
    rte_ft.gpt2.core: configs/rte_ft.gpt2.core.yaml
    rte_ft.qwen3.core: configs/rte_ft.qwen3.core.yaml
    rte_ft.qwen3.nnsight: configs/rte_ft.qwen3.nnsight.yaml
    rte_ft.qwen3.transformer_lens: configs/rte_ft.qwen3.transformer_lens.yaml
datamodules:
  rte_boolq:
    entrypoint: rte_boolq.py
    config: configs/datamodule.rte_boolq.yaml
# files the component ships for its users (#765, #847): finetuning-scheduler schedules, and CLI run configurations for
# the `rte_ft` variant on each training-loop interface (`interpretune --config hub://speediedan/rte/runs/<file>`)
extra_files:
- ft_schedules
- runs
