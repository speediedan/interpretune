# interpretune component manifest (schema v1) — the concept-direction notebook experiment (#498).
#
# The publish source is this directory's in-repo layout (configs beside the pipeline sources);
# the `experiment_snapshot_rewrite` step restructures the STAGED tree into the runnable `exp/`
# package, so nothing here names staged paths. The notebook template (.ipynb) is deliberately
# not carried yet: it still bootstraps from the in-repo test harness, and template execution
# from a snapshot is the follow-up once the pipeline snapshot below ships.
it_schema_version: 1
kinds:
- experiment
requires:
  interpretune: '>=0.1.dev0'
  components:
  - speediedan/rte@738e41229e39379c432da4e5830af01d6e8960b2
experiment_snapshot_rewrite: concept-direction-v1
experiments:
  gemma3_1b_it_local_color_fruit_orange:
    config: concept_direction/configs/gemma3_1b_it_local_color_fruit_orange.yaml
    pipeline: concept_direction/concept_direction.py
    files: &shared_files
    - concept_direction/configs/base_gemma3_it_local.yaml
    - concept_direction/configs/cp_color_fruit_orange_gemma_it.yaml
    - pipeline_patterns.py
    - concept_direction/analysis/concept_direction_analysis.py
    - concept_direction/analysis/intervention_drift_analysis.py
  gemma3_1b_it_local_color_fruit_orange_fs_l10_n5:
    config: concept_direction/configs/gemma3_1b_it_local_color_fruit_orange_fs_l10_n5.yaml
    pipeline: concept_direction/concept_direction.py
