# Flattened, SELF-CONTAINED experiment configuration (hub design v3 §11.4): the session enters
# through the one-door body below (global/defaults rolled in at migration time); trainer/runner/seed
# keys pass through to the argv shim. base_debug.yaml remains an OPTIONAL debug overlay (--config).
shared_config:
  model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
  task_name: rte
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  tokenizer_id_overrides:
    pad_token_id: 128004
  tokenizer_kwargs:
    use_fast: true
    local_files_only: false
    add_bos_token: false
    padding_side: left
    model_input_names:
    - input_ids
    - attention_mask
registered_cfg:
  datamodule_cfg:
    class_path: interpretune.config.datamodule.ITDataModuleConfig
    init_args:
      train_batch_size: 2
      eval_batch_size: 2
      cust_tokenization_pattern: llama3-chat
      special_tokens_dict:
        pad_token: <|finetune_right_pad_id|>
      enable_datasets_cache: true
      prepare_data_map_cfg:
        batched: true
      data_collator_cfg:
        collator_class: transformers.DataCollatorWithPadding
      prompt_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqPromptConfig
        compose_ref: speediedan/prompt-configs#Llama3PromptConfig
      tokenizers_parallelism: false
  module_cfg:
    class_path: it_examples.experiments.rte_boolq.RTEBoolqConfig
    init_args:
      model_cfg:
        _attn_implementation: eager
      generative_step_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.config.mixins.HFGenerationConfig
            init_args:
              model_config:
                max_new_tokens: 5
                pad_token_id: 128004
                output_logits: true
                return_dict_in_generate: true
      hf_from_pretrained_cfg:
        class_path: interpretune.config.module.HFFromPretrainedConfig
        init_args:
          use_model_cache: false
          model_head: transformers.LlamaForCausalLM
          activation_checkpointing: false
          bitsandbytesconfig:
            load_in_4bit: true
            bnb_4bit_use_double_quant: true
            bnb_4bit_quant_type: nf4
            bnb_4bit_compute_dtype: bfloat16
          lora_cfg:
            r: 8
            lora_alpha: 32
            target_modules:
            - q_proj
            - v_proj
            lora_dropout: 0.05
            bias: none
            task_type: CAUSAL_LM
          pretrained_kwargs:
            device_map: 0
            dtype: bfloat16
  datamodule_cls: it_examples.experiments.rte_boolq.RTEBoolqDataModule
  module_cls: it_examples.experiments.rte_boolq.RTEBoolqModule
adapter_ctx:
- lightning
trainer:
  accumulate_grad_batches: 1
  precision: bf16-true
  devices: 1
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      name: llama3_chat_rte_3b_qlora_genclassif_test_only
      save_dir: lightning_logs
seed_everything: 42
