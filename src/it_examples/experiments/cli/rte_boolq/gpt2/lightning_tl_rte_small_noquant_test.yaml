# Flattened, SELF-CONTAINED experiment configuration (hub design v3 §11.4): the session enters
# through the one-door body below (global/defaults rolled in at migration time); trainer/runner/seed
# keys pass through to the argv shim. base_debug.yaml remains an OPTIONAL debug overlay (--config).
shared_config:
  model_name_or_path: gpt2
  task_name: rte
  tokenizer_name: gpt2
  tokenizer_id_overrides:
    pad_token_id: 50256
  tokenizer_kwargs:
    padding_side: right
    add_bos_token: true
    local_files_only: false
    model_input_names:
    - input
    - attention_mask
registered_cfg:
  datamodule_cfg:
    class_path: interpretune.config.datamodule.ITDataModuleConfig
    init_args:
      enable_datasets_cache: false
      eval_batch_size: 2
      prepare_data_map_cfg:
        batched: true
      prompt_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqPromptConfig
      signature_columns:
      - input
      - attention_mask
      - labels
      train_batch_size: 2
  module_cfg:
    class_path: it_examples.experiments.rte_boolq.RTEBoolqTLConfig
    init_args:
      cust_fwd_kwargs: {}
      experiment_tag: lightning_tl_rte_small_noquant_test
      tl_cfg:
        class_path: interpretune.adapters.transformer_lens.config.ITLensFromPretrainedConfig
        init_args:
          device: cuda
          dtype: bfloat16
      hf_from_pretrained_cfg:
        class_path: interpretune.config.module.HFFromPretrainedConfig
        init_args:
          use_model_cache: false
          model_head: transformers.GPT2LMHeadModel
          activation_checkpointing: false
      generative_step_cfg:
        class_path: it_examples.experiments.rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: true
          lm_generation_cfg:
            class_path: interpretune.adapters.transformer_lens.config.TLensGenerationConfig
            init_args:
              max_new_tokens: 1
  datamodule_cls: it_examples.experiments.rte_boolq.RTEBoolqDataModule
  module_cls: it_examples.experiments.rte_boolq.RTEBoolqModule
adapter_ctx:
- lightning
- transformer_lens
trainer:
  precision: bf16-true
  accumulate_grad_batches: 1
  accelerator: gpu
  strategy: auto
  devices: 1
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs
      name: gpt2_tl_rte_small_noquant_test
seed_everything: 42
