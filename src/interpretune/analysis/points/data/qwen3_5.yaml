# Bundled until the maps are read from venngram's registry instead (#1026, pending), which does not yet publish this
# class.
#
# Qwen3.5 text (`Qwen3_5ForCausalLM`): the multimodal document's language model at the top level. NNsight loads a
# Qwen3.5 checkpoint through this class for text generation, and every weight of the multimodal checkpoint except the
# vision tower's loads into it. Pre-norm blocks with a gated MLP, and no post-sublayer norms.
#
# The stack is hybrid, as in the multimodal document: `attn` covers only the full-attention layers and the declared
# `linear_attn` sublayer covers the rest, so an attention point on a layer its row excludes is refused by name. The
# layer lists are Qwen3.5-4B's 32 layers (`layer_types`). Module paths were measured on the transformers class.
schema_version: 2
architecture: Qwen3_5ForCausalLM
properties:
  sandwich_norms: false
kinds:
  linear_attn: {output: tensor, sublayer: true}
components:
  embed:                  {module: "model.embed_tokens",                        kind: embed}
  blocks.{i}:             {module: "model.layers.{i}",                          kind: block}
  blocks.{i}.ln1:         {module: "model.layers.{i}.input_layernorm",          kind: norm}
  blocks.{i}.attn:        {module: "model.layers.{i}.self_attn",                kind: attn,
                           layers: [3, 7, 11, 15, 19, 23, 27, 31]}
  blocks.{i}.attn.o:      {module: "model.layers.{i}.self_attn.o_proj",         kind: linear,
                           layers: [3, 7, 11, 15, 19, 23, 27, 31]}
  blocks.{i}.linear_attn: {module: "model.layers.{i}.linear_attn",              kind: linear_attn,
                           layers: [0, 1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 14, 16, 17, 18, 20, 21, 22, 24, 25, 26, 28, 29, 30]}
  blocks.{i}.linear_attn.o: {module: "model.layers.{i}.linear_attn.out_proj",   kind: linear,
                           layers: [0, 1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 14, 16, 17, 18, 20, 21, 22, 24, 25, 26, 28, 29, 30]}
  blocks.{i}.ln2:         {module: "model.layers.{i}.post_attention_layernorm", kind: norm}
  blocks.{i}.mlp:         {module: "model.layers.{i}.mlp",                      kind: mlp}
  blocks.{i}.mlp.gate:    {module: "model.layers.{i}.mlp.gate_proj",            kind: linear}
  blocks.{i}.mlp.in:      {module: "model.layers.{i}.mlp.up_proj",              kind: linear}
  blocks.{i}.mlp.out:     {module: "model.layers.{i}.mlp.down_proj",            kind: linear}
  ln_final:               {module: "model.norm",                                kind: norm}
  unembed:                {module: "lm_head",                                   kind: unembed}
