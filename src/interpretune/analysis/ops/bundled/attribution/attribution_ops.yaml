# Collection header (#266 Phase 3, D8): versions this family's op CONTRACT SET -- the names, schemas and
# traits its ops present to callers -- not the interpretune package. Bundled families deliberately declare NO
# `requires:` window: they ship inside the wheel, so a compatibility window against the installed package is
# vacuous by construction, and a naive one is actively harmful (a `>=0.1` floor does not match the
# `0.1.0.devN+g<sha>` versions setuptools_scm produces between tags, so every bundled op would be skipped in a
# source checkout). Hub collections are the ones that can be out of step, so they declare windows.
collection:
  name: attribution
  version: 0.1.0

model_gradient:
  description: Model gradient-based attribution
  implementation: interpretune.analysis.ops.bundled.attribution.attribution_ops.model_gradient_impl
  importable_params:
    logit_diff_fn: interpretune.analysis.optools.boolean_logits_to_avg_logit_diff
    get_loss_preds_diffs: interpretune.analysis.optools.get_loss_preds_diffs
  required_ops: [get_answer_indices]
  aliases: []
  input_schema:
    input:
      datasets_dtype: int64
      connected_obj: datamodule
    label_ids:
      datasets_dtype: int64
    orig_labels:
      datasets_dtype: int64
  output_schema:
    answer_logits:
      datasets_dtype: float32
      sequence_type: false
      array_shape: [batch_size, max_answer_tokens, num_classes]
    answer_indices:
      datasets_dtype: int64
    loss:
      datasets_dtype: float32
      sequence_type: false
    logit_diffs:
      datasets_dtype: float32
    preds:
      datasets_dtype: int64
    grad_cache:
      datasets_dtype: object
      non_tensor: true
      intermediate_only: true
    prompts:
      datasets_dtype: string
      required: false
      non_tensor: true

gradient_attribution:
  description: Compute attribution values from gradients
  implementation: interpretune.analysis.ops.bundled.attribution.attribution_ops.gradient_attribution_impl
  required_ops: [get_alive_latents]
  aliases: []
  input_schema:
    input:
      datasets_dtype: float32
      connected_obj: datamodule
    answer_indices:
      datasets_dtype: int64
    logit_diffs:
      datasets_dtype: float32
    grad_cache:
      datasets_dtype: object
      non_tensor: true
      intermediate_only: true
  output_schema:
    attribution_values:
      datasets_dtype: float32
      per_latent_model_hook: true
    correct_activations:
      datasets_dtype: float32
      per_latent_model_hook: true
    prompts:
      datasets_dtype: string
      required: false
      non_tensor: true

ablation_attribution:
  description: Compute attribution values from ablation
  implementation: interpretune.analysis.ops.bundled.attribution.attribution_ops.ablation_attribution_impl
  importable_params:
    logit_diff_fn: interpretune.analysis.optools.boolean_logits_to_avg_logit_diff
    get_loss_preds_diffs: interpretune.analysis.optools.get_loss_preds_diffs
  aliases: []
  # TODO: remove appropriate output_schema input_schema columns if/when get_loss_preds_diffs is made an op
  input_schema:
    input:
      datasets_dtype: float32
      connected_obj: datamodule
    # Not consumed by ablation_attribution_impl (#299 audit): the impl reads answer_logits,
    # alive_latents and logit_diffs, and the only helper it hands the batch to
    # (get_loss_preds_diffs) reads label_ids/orig_labels. Declared for column derivation, so
    # `required: false` per NOTE [Inherited Inputs Are Not Obligations] -- keeping it required
    # gated the op on a field it never reads.
    answer_indices:
      datasets_dtype: int64
      required: false
    alive_latents:
      datasets_dtype: int64
      per_latent_model_hook: true
      non_tensor: true
    logit_diffs:
      datasets_dtype: float32
    answer_logits:
      datasets_dtype: float32
      per_latent: true
      sequence_type: false
      array_shape: [batch_size, vocab_size]
    label_ids:
      datasets_dtype: int64
    orig_labels:
      datasets_dtype: int64
  output_schema:
    attribution_values:
      datasets_dtype: float32
      per_latent_model_hook: true
    logit_diffs:
      datasets_dtype: float32
      per_latent: true
    answer_logits:
      datasets_dtype: float32
      per_latent: true
      sequence_type: false
      array_shape: [batch_size, max_answer_tokens, num_classes]
    loss:
      datasets_dtype: float32
      per_latent: true
      sequence_type: false
    preds:
      datasets_dtype: int64
      per_latent: true
