      required: false
      non_tensor: true
      sequence_type: false
    jlens_positions:
      datasets_dtype: int64
      required: false
      array_shape: [null]
      sequence_type: false
    jlens_repo_id:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    jlens_model_id:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    jlens_lens_path:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
  output_schema:
    jlens_concept_cosine:
      datasets_dtype: float32
      array_shape: [null, null]
      sequence_type: false
    jlens_concept_token_ids:
      datasets_dtype: int64
      array_shape: [null]
      sequence_type: false
    jlens_layer:
      datasets_dtype: int64
      non_tensor: true
      sequence_type: false
    jlens_positions:
      datasets_dtype: int64
      array_shape: [null]
      sequence_type: false
    jlens_provenance:
      datasets_dtype: object
      required: false
      non_tensor: true
      sequence_type: false
    jlens_basis:
      datasets_dtype: string
      # Which named basis produced this result. Recorded because the folded and unfolded bases
      # are not related by a coefficient, so two results differing only in that choice are not
      # comparable -- and without this field they are indistinguishable after the fact.

