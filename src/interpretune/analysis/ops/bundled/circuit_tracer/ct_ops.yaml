# Collection header (#266 Phase 3, D8): versions this family's op CONTRACT SET -- the names, schemas and
# traits its ops present to callers -- not the interpretune package. Bundled families deliberately declare NO
# `requires:` window: they ship inside the wheel, so a compatibility window against the installed package is
# vacuous by construction, and a naive one is actively harmful (a `>=0.1` floor does not match the
# `0.1.0.devN+g<sha>` versions setuptools_scm produces between tags, so every bundled op would be skipped in a
# source checkout). Hub collections are the ones that can be out of step, so they declare windows.
collection:
  name: circuit_tracer
  version: 0.1.0

compute_attribution_graph:
  description: Generate an attribution graph with circuit-tracer
  implementation: interpretune.analysis.ops.bundled.circuit_tracer.ct_ops.compute_attribution_graph_impl
  required_capabilities: [attribution_graph]
  aliases: [ct_graph]
  input_schema:
    concept_direction:
      datasets_dtype: float32
      required: false
      sequence_type: true
  output_schema:
    input_string:
      datasets_dtype: string
      non_tensor: true
      sequence_type: false
    adjacency_matrix:
      datasets_dtype: float32
      array_shape: [null, null]
      sequence_type: false
    active_features:
      datasets_dtype: int64
      array_shape: [null, 3]
      sequence_type: false
    selected_features:
      datasets_dtype: int64
      required: false
      sequence_type: true
    activation_values:
      datasets_dtype: float32
      required: false
      sequence_type: true
    logit_target_ids:
      datasets_dtype: int64
      required: false
      sequence_type: true
    logit_target_tokens:
      datasets_dtype: string
      required: false
      sequence_type: true
    logit_probabilities:
      datasets_dtype: float32
      required: false
      sequence_type: true
    input_tokens:
      datasets_dtype: int64
      required: false
      sequence_type: true
    graph_cfg_json:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    graph_scan_json:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    graph_vocab_size:
      datasets_dtype: int64
      required: false
      sequence_type: false
    graph_metadata:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false

extract_top_features:
  description: Extract top-N influential features from an attribution graph
  implementation: interpretune.analysis.ops.bundled.circuit_tracer.ct_ops.extract_top_features_impl
  aliases: [ct_top_features]
  # `top_n` is a tunable the implementation accepts that nothing declared, so it was invisible to
  # anything reading op definitions and could only be changed by editing Python. Declared here at its
  # existing effective default (`null`, meaning no limit), so this is behavior-preserving. Call-time
  # kwargs still take precedence over declared params, so a caller passing `top_n=` is unaffected.
  # This is also `normal_params`' first in-tree user; see issue #61.
  normal_params:
    top_n: null
  input_schema:
    active_features:
      datasets_dtype: int64
      array_shape: [null, 3]
      sequence_type: false
    activation_values:
      datasets_dtype: float32
      sequence_type: true
    node_influence_scores:
      datasets_dtype: float32
      required: false
      sequence_type: true
    node_signed_influence_scores:
      datasets_dtype: float32
      required: false
      sequence_type: true
    node_logit_diff_gradient_scores:
      datasets_dtype: float32
      required: false
      sequence_type: true
  output_schema:
    top_feature_ids:
      datasets_dtype: int64
      array_shape: [null, 3]
      sequence_type: false
    top_feature_scores:
      datasets_dtype: float32
      sequence_type: true
    top_feature_activation_values:
      datasets_dtype: float32
      required: false
      sequence_type: true

