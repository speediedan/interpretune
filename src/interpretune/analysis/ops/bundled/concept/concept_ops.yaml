    concept_latent_state:
      datasets_dtype: float32
      array_shape: [null, null]
      sequence_type: false
      site: {binds: frame}
    concept_group_id:
      datasets_dtype: int64
      array_shape: [null]
      sequence_type: false
    concept_group_name:
      datasets_dtype: string
      non_tensor: true
      sequence_type: true
    concept_example_logit_diff:
      datasets_dtype: float32
      array_shape: [null]
      sequence_type: false
    concept_example_weight:
      datasets_dtype: float32
      array_shape: [null]
      sequence_type: false
    concept_context_indices:
      datasets_dtype: int64
      required: false
      array_shape: [null]
      sequence_type: false
      site: {binds: tokens}
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false

concept_direction:
  description: Aggregate latent concept examples into a normalized concept direction vector
  implementation: interpretune.analysis.ops.bundled.concept.concept_ops.concept_direction_impl
  required_techniques: [attribution_graph]
  aliases: [semantic_direction]
  # Declared cross-batch state for streaming aggregation; the module constants
  # CONCEPT_STREAMING_STATE_FIELDS are the source of truth (pinned by test_bundled_concept_streaming).
  # reset_each_epoch stays false so multi-epoch analysis accumulates instead of discarding every
  # epoch but the last (batch_idx restarts at 0 per epoch).
  op_state:
    scope: run
    reset_each_epoch: false
    fields:
      - concept_running_state_sum_a
      - concept_running_weight_a
      - concept_running_state_sum_b
      - concept_running_weight_b
      - concept_pending_a_states
      - concept_pending_a_weights
      - concept_pending_b_states
      - concept_pending_b_weights
      - concept_running_residual_sum
      - concept_running_pair_weight
  input_schema:
    concept_latent_state:
      datasets_dtype: float32
      required: false
      sequence_type: true
    concept_group_id:
      datasets_dtype: int64
      required: false
    concept_group_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_example_weight:
      datasets_dtype: float32
      required: false
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_label:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_a:
      required: false
      datasets_dtype: string
      non_tensor: true
    concept_group_b:
      required: false
      datasets_dtype: string
      non_tensor: true
    concept_direction_mode:
      datasets_dtype: string
      required: false
      non_tensor: true
      default: mean_difference
    concept_basis:
      datasets_dtype: string
      required: true
      non_tensor: true
    jlens_layer:
      datasets_dtype: int64
      required: false
      non_tensor: true
    jlens_layer_percentile:
      datasets_dtype: float32
      required: false
      non_tensor: true
    jlens_lens_path:
      datasets_dtype: string
      required: false
      non_tensor: true
    jlens_model_id:
      datasets_dtype: string
      required: false
      non_tensor: true
    jlens_repo_id:
      datasets_dtype: string
      required: false
      non_tensor: true
    jlens_revision:
      datasets_dtype: string
      required: false
      non_tensor: true
    jlens_kind:
      # Which lens kind builds a `jlens_*` basis direction (`jlens` or `jpp`); see jlens_read.
      datasets_dtype: string
      required: false
      non_tensor: true
  output_schema:
    concept_direction:
      datasets_dtype: float32
      dyn_dim: 0
      dyn_dim_ceil: vocab_size
      sequence_type: true
      site: {binds: frame}
    concept_label:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_a_token_ids:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
      site: {binds: tokens}
    concept_group_b_token_ids:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
      site: {binds: tokens}
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_direction_mode:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_basis:
      datasets_dtype: string
      required: true
      non_tensor: true
      sequence_type: false
    jlens_layer:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: false
      site: {binds: layer}
    jlens_kind:
      # Which lens kind built a `jlens_*` basis direction; absent for the other bases.
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    jlens_provenance:
      datasets_dtype: object
      required: false
      non_tensor: true
      sequence_type: false

model_fwd_intervention:
  description: Apply generalized hook-point interventions and return pre/post intervention logits
  implementation: interpretune.analysis.ops.bundled.concept.concept_ops.model_fwd_intervention_impl
  # The mode and scope axes are payload-driven for this op (any declared mode of the backend), so it
  # declares the surface only; a composite built on it that fixes a mode declares that mode itself.
  required_capabilities: [intervention]
  aliases: [direction_intervention, direct_concept_direction_intervention]
  input_schema:
    interventions:
      datasets_dtype: object
      required: false
      non_tensor: true
    interventions_json:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_hook_pattern:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_tensor:
      datasets_dtype: float32
      required: false
      sequence_type: true
    intervention_tensors_json:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_op:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_use_intervention_tensor_as_basis:
      datasets_dtype: bool
      required: false
      sequence_type: false
    intervention_scale_factor:
      datasets_dtype: float32
      required: false
      sequence_type: false
    intervention_position_scope:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_positions:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
    use_latent_models:
      datasets_dtype: bool
      required: false
      sequence_type: false
    concept_direction:
      datasets_dtype: float32
      required: false
      sequence_type: true
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    direction_scale_factor:
      datasets_dtype: float32
      required: false
      sequence_type: false
    logit_target_ids:
      datasets_dtype: int64
      required: false
      sequence_type: true
  output_schema:
    pre_intervention_logits:
      datasets_dtype: float32
      required: false
      sequence_type: true
    post_intervention_logits:
      datasets_dtype: float32
      required: false
      sequence_type: true
    intervention_position_effect:
      datasets_dtype: float32
      required: false
      sequence_type: false
      dyn_dim: 1
      dyn_dim_ceil: max_seq_len
      array_shape: [null, batch_size]
    logit_diff:
      datasets_dtype: float32
      required: false
      sequence_type: false

model_bwd_intervention:
  description: Apply hook-point interventions to gradients during a backward pass and return the gradients they change
  implementation: interpretune.analysis.ops.bundled.concept.concept_ops.model_bwd_intervention_impl
  # The payload is the forward op's, read by the same resolver; every spec acts on the gradient at its site, so the
  # backend must declare the `grad` flow (checked by name before anything runs).
  required_capabilities: [intervention, gradients]
  aliases: [gradient_intervention]
  input_schema:
    interventions:
      datasets_dtype: object
      required: false
      non_tensor: true
    interventions_json:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_hook_pattern:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_tensor:
      datasets_dtype: float32
      required: false
      sequence_type: true
    intervention_tensors_json:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_op:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_use_intervention_tensor_as_basis:
      datasets_dtype: bool
      required: false
      sequence_type: false
    intervention_scale_factor:
      datasets_dtype: float32
      required: false
      sequence_type: false
    intervention_position_scope:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    intervention_positions:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
    use_latent_models:
      datasets_dtype: bool
      required: false
      sequence_type: false
    concept_direction:
      datasets_dtype: float32
      required: false
      sequence_type: true
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    direction_scale_factor:
      datasets_dtype: float32
      required: false
      sequence_type: false
    logit_target_ids:
      datasets_dtype: int64
      required: false
      sequence_type: true
    # The scalar the gradient is taken of (a Readout, or a callable of the logits), for in-process use; refused beside
    # logit_target_ids, which only the default readout reads.
    readout:
      datasets_dtype: object
      required: false
      non_tensor: true
    grad_capture:
      datasets_dtype: object
      required: false
      non_tensor: true
    grad_capture_sets:
      datasets_dtype: object
      required: false
      non_tensor: true
  output_schema:
    grad_point_names:
      datasets_dtype: string
      sequence_type: true
      non_tensor: true
      site: {binds: layer}
    grad_shape:
      datasets_dtype: int64
      sequence_type: true
    pre_intervention_grad_values:
      datasets_dtype: float32
      sequence_type: true
    post_intervention_grad_values:
      datasets_dtype: float32
      sequence_type: true
    bwd_intervention_metric:
      datasets_dtype: float32
      required: false
      sequence_type: false
    intervention_grad_position_effect:
      datasets_dtype: float32
      required: false
      sequence_type: false
      dyn_dim: 1
      dyn_dim_ceil: max_seq_len
      array_shape: [null, batch_size]

