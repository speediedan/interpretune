# Collection header (#266 Phase 3, D8): versions this family's op CONTRACT SET -- the names, schemas and
# traits its ops present to callers -- not the interpretune package. Bundled families deliberately declare NO
# `requires:` window: they ship inside the wheel, so a compatibility window against the installed package is
# vacuous by construction, and a naive one is actively harmful (a `>=0.1` floor does not match the
# `0.1.0.devN+g<sha>` versions setuptools_scm produces between tags, so every bundled op would be skipped in a
# source checkout). Hub collections are the ones that can be out of step, so they declare windows.
collection:
  name: concept
  version: 0.1.0

extract_concept_latent_state:
  description: Extract per-example latent rows from the configured cache key
  implementation: interpretune.analysis.ops.bundled.concept.concept_ops.extract_concept_latent_state_impl
  aliases: [concept_latent_state_from_cache]
  input_schema:
    cache:
      datasets_dtype: object
      non_tensor: true
      intermediate_only: true
    answer_indices:
      datasets_dtype: int64
    context_token_indices:
      datasets_dtype: int64
      required: false
      array_shape: [null]
      sequence_type: false
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      default: unembed.hook_in
  output_schema:
    concept_latent_state:
      datasets_dtype: float32
      array_shape: [null, null]
      sequence_type: false
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    context_token_indices:
      datasets_dtype: int64
      required: false
      array_shape: [null]
      sequence_type: false

extract_concept_latent_examples:
  description: Filter and annotate latent rows for concept-direction aggregation
  implementation: interpretune.analysis.ops.bundled.concept.concept_ops.extract_concept_latent_examples_impl
  aliases: [concept_latent_examples]
  # Declared cross-batch state for the legacy `in_memory` aggregation mode; the module constants
  # CONCEPT_AGGREGATE_ROW_FIELDS are the source of truth (pinned by test_bundled_concept_streaming).
  op_state:
    scope: run
    reset_each_epoch: false
    fields:
      - concept_latent_state_rows
      - concept_group_id_rows
      - concept_group_name_rows
      - concept_example_logit_diff_rows
      - concept_example_weight_rows
      - concept_context_indices_rows
  input_schema:
    concept_latent_state:
      datasets_dtype: float32
      required: false
      array_shape: [null, null]
      sequence_type: false
    cache:
      datasets_dtype: object
      required: false
      non_tensor: true
      intermediate_only: true
    answer_indices:
      datasets_dtype: int64
      required: false
    context_token_indices:
      datasets_dtype: int64
      required: false
      array_shape: [null]
      sequence_type: false
    orig_labels:
      datasets_dtype: int64
    logit_diffs:
      datasets_dtype: float32
    concept_group_a_label_ids:
      datasets_dtype: int64
      non_tensor: true
      sequence_type: true
    concept_group_b_label_ids:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      default: unembed.hook_in
    concept_correct_only:
      datasets_dtype: int64
      required: false
      non_tensor: true
      default: 1
    concept_weight_by_logit_diff:
      datasets_dtype: int64
      required: false
      non_tensor: true
      default: 0
  output_schema:
    concept_latent_state:
      datasets_dtype: float32
      array_shape: [null, null]
      sequence_type: false
    concept_group_id:
      datasets_dtype: int64
      array_shape: [null]
      sequence_type: false
    concept_group_name:
      datasets_dtype: string
      non_tensor: true
      sequence_type: true
    concept_example_logit_diff:
      datasets_dtype: float32
      array_shape: [null]
      sequence_type: false
    concept_example_weight:
      datasets_dtype: float32
      array_shape: [null]
      sequence_type: false
    concept_context_indices:
      datasets_dtype: int64
      required: false
      array_shape: [null]
      sequence_type: false
    concept_cache_key:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false

concept_direction:
  description: Aggregate latent concept examples into a normalized concept direction vector
  implementation: interpretune.analysis.ops.bundled.concept.concept_ops.concept_direction_impl
  required_capabilities: [attribution_graph]
  aliases: [semantic_direction]
  # Declared cross-batch state for streaming aggregation; the module constants
  # CONCEPT_STREAMING_STATE_FIELDS are the source of truth (pinned by test_bundled_concept_streaming).
  # reset_each_epoch stays false so multi-epoch analysis accumulates instead of discarding every
  # epoch but the last (batch_idx restarts at 0 per epoch).
  op_state:
    scope: run
    reset_each_epoch: false
    fields:
      - concept_running_state_sum_a
      - concept_running_weight_a
      - concept_running_state_sum_b
      - concept_running_weight_b
      - concept_pending_a_states
      - concept_pending_a_weights
      - concept_pending_b_states
      - concept_pending_b_weights
      - concept_running_residual_sum
      - concept_running_pair_weight
  input_schema:
    concept_latent_state:
      datasets_dtype: float32
      required: false
      sequence_type: true
    concept_group_id:
      datasets_dtype: int64
      required: false
    concept_group_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_example_weight:
      datasets_dtype: float32
      required: false
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_label:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_a:
      required: false
      datasets_dtype: string
      non_tensor: true
    concept_group_b:
      required: false
      datasets_dtype: string
      non_tensor: true
    concept_direction_mode:
      datasets_dtype: string
      required: false
      non_tensor: true
      default: mean_difference
  output_schema:
    concept_direction:
      datasets_dtype: float32
      dyn_dim: 0
      dyn_dim_ceil: vocab_size
      sequence_type: true
    concept_label:
      datasets_dtype: string
      required: false
      non_tensor: true
    concept_group_a_token_ids:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
    concept_group_b_token_ids:
      datasets_dtype: int64
      required: false
      non_tensor: true
      sequence_type: true
    concept_group_a_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_group_b_name:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false
    concept_direction_mode:
      datasets_dtype: string
      required: false
      non_tensor: true
      sequence_type: false

