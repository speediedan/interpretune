# Interpretune's settings for the any-vendor GPU job shared with finetuning-scheduler (gpu-epsilon's
# templates/gpu-job.yml, the `ci` repository resource each GPU pipeline declares, pinned to a tag). That template owns
# vendor selection, the digest-pinned image check, the container's lifecycle, the shared mounts and evidence
# publishing; this file passes what is interpretune's own:
#   - the variable prefix `IT`, so the template sets IT_CTR, IT_GPU_VENDOR, IT_IMAGE, IT_DEVICE_OPTIONS and
#     IT_GPU_ONE_STAGE, and publishes evidence once a step sets IT_PHASES_COLLECTED;
#   - the agent's HF cache at /opt/interpretune/hf_cache, and the agent's own Docker socket at /var/run/docker.sock
#     (each agent's rootless daemon has its own uid);
#   - `clean: outputs`, which keeps the source folder between builds (gpu-tests.yml's WORKSPACE REUSE note says why);
#   - a backend check before the pipeline's steps, and the lease release the cleanup runs.
# The pipeline's steps run their commands inside the container through .azure-pipelines/scripts/ctr.sh
# (`bash .azure-pipelines/scripts/ctr.sh "<command>"`), which forwards the variables those commands read.
parameters:
  - name: jobName
    type: string
  - name: displayName
    type: string
    default: ''
  # any: either agent. nvidia/amd: a vendor-demanded job.
  - name: vendor
    type: string
    values: [any, nvidia, amd]
  - name: jobClass
    type: string
    values: [ci-any-vendor, ci-vendor-marked, ci-release]
  # {nvidia: <image>@sha256:..., amd: <image>@sha256:...}: digest-pinned, or the job fails before it starts anything.
  - name: images
    type: object
  - name: timeoutInMinutes
    type: number
    default: 120
  # Whether the checkout fetches the merge commit's first parent too (the GPU run planner diffs against it).
  - name: fetchDepth
    type: number
    default: 2
  - name: steps
    type: stepList

jobs:
  - template: templates/gpu-job.yml@ci
    parameters:
      jobName: ${{ parameters.jobName }}
      displayName: ${{ parameters.displayName }}
      vendor: ${{ parameters.vendor }}
      jobClass: ${{ parameters.jobClass }}
      project: ci-it
      images: ${{ parameters.images }}
      variablePrefix: IT
      artifactPrefix: it
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
      fetchDepth: ${{ parameters.fetchDepth }}
      workspaceClean: outputs
      hostPrep: |
        hf_cache="/opt/az_pipeline_agent/_work/hf_cache/$(Agent.Name)"
        mkdir -p "$hf_cache"
        sock="${DOCKER_HOST#unix://}"
        [[ -S "$sock" ]] || { echo "##vso[task.logissue type=error]no Docker socket at ${sock} (DOCKER_HOST)"; exit 1; }
      containerOptions: |
        -v "${hf_cache}:/opt/interpretune/hf_cache:rw" -v "${sock}:/var/run/docker.sock"
        -e HF_HOME=/opt/interpretune/hf_cache -e HF_DATASETS_CACHE=/opt/interpretune/hf_cache/datasets
        -e HF_HUB_CACHE=/opt/interpretune/hf_cache/hub -e XDG_CACHE_HOME=/opt/interpretune/hf_cache
        -e APPLY_POST_UPGRADES=false -e COVERAGE_CORE=sysmon
      releaseCommand: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/gpu_stage_lease.sh release all'
      steps:
        # Backend truth before anything else: the torch build must match the vendor the agent reported, with both
        # devices.
        - bash: |
            bash .azure-pipelines/scripts/ctr.sh 'source /tmp/venvs/it_dev/bin/activate && python - <<"PY"
            import os
            import torch
            expected = os.environ["IT_GPU_VENDOR"]
            actual = "amd" if torch.version.hip else "nvidia" if torch.version.cuda else "cpu"
            assert actual == expected, (expected, actual, torch.__version__)
            assert torch.cuda.device_count() >= 2, torch.cuda.device_count()
            print({"torch": torch.__version__, "cuda": torch.version.cuda, "hip": torch.version.hip,
                   "devices": [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]})
            PY'
          displayName: 'Verify backend'
        - ${{ each step in parameters.steps }}:
            - ${{ step }}
