# The any-vendor GPU job (#703, after finetuning-scheduler's #128/#130): one job that runs on either GPU agent, choosing
# its image and device options at RUNTIME from the agent's own GPU_VENDOR (declared in the agent's `.env`, so it is
# also a capability). An Azure container resource is fixed before the agent is known, which is why this is a host job
# that starts its own container rather than a container job.
#
# Admission is by demands: the job class (`ci-any-vendor`, `ci-vendor-marked`, `ci-release`) and the project (`ci-it`)
# are user capabilities an operator toggles on each agent, and a vendor-demanded job adds `GPU_VENDOR -equals <vendor>`.
#
# The template owns the container's lifecycle. The pipeline passes `steps`: host steps that run their commands inside
# the container through .azure-pipelines/scripts/ctr.sh (`bash .azure-pipelines/scripts/ctr.sh "<command>"`), which
# forwards the variables those commands read. Mounts, as in the container jobs this replaces:
#   - the checkout at its host path, so a path a step prints for the agent is valid on the host too;
#   - the agent's HF cache at /opt/interpretune/hf_cache;
#   - the host lease directory at /gpu_leases and the host's lease tool at /gpu_lease_tool (read-only);
#   - the agent's own Docker socket at /var/run/docker.sock (each agent's rootless daemon has its own uid).
#   - the job's artifact staging directory's `evidence` at /evidence: the phase manifests, records and reports
#     (tests/gpu_ci/phase_report.py), published as the job's phase evidence.
# The container runs as the image's user, which rootless Docker maps to the agent's uid, so nothing a step writes is
# left owned by a uid the agent cannot remove.
parameters:
  - name: jobName
    type: string
  - name: displayName
    type: string
    default: ''
  # any: either agent. nvidia/amd: a vendor-demanded job.
  - name: vendor
    type: string
    values: [any, nvidia, amd]
  - name: jobClass
    type: string
    values: [ci-any-vendor, ci-vendor-marked, ci-release]
  - name: project
    type: string
    default: ci-it
    values: [ci-it]
  # {nvidia: <image>@sha256:..., amd: <image>@sha256:...}: digest-pinned, or the job fails before it starts anything.
  - name: images
    type: object
  - name: timeoutInMinutes
    type: number
    default: 120
  # Whether the checkout fetches the merge commit's first parent too (the GPU run planner diffs against it).
  - name: fetchDepth
    type: number
    default: 2
  - name: steps
    type: stepList

jobs:
  - job: ${{ parameters.jobName }}
    ${{ if ne(parameters.displayName, '') }}:
      displayName: ${{ parameters.displayName }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    cancelTimeoutInMinutes: 2
    pool:
      name: Default
      demands:
        - Agent.OS -equals Linux
        - GPU_VENDOR
        - GPU_COUNT -equals 2
        - ${{ parameters.jobClass }}
        - ${{ parameters.project }}
        - ${{ if ne(parameters.vendor, 'any') }}:
            - GPU_VENDOR -equals ${{ parameters.vendor }}
    # `clean: outputs` keeps the source folder between builds (gpu-tests.yml's WORKSPACE REUSE note says why)
    workspace:
      clean: outputs
    variables:
      IT_EXPECTED_VENDOR: ${{ parameters.vendor }}
      IT_CTR: it-$(Build.BuildId)-$(System.JobAttempt)-${{ parameters.jobName }}
    steps:
      - checkout: self
        fetchDepth: ${{ parameters.fetchDepth }}

      - bash: |
          set -euo pipefail
          # One table maps the agent's vendor to its image, device options and the device node that must exist. AMD
          # runs one whole-server lease stage: its two cards are identical, so the small-device stage's placement buys
          # nothing there.
          case "${GPU_VENDOR:-}" in
            nvidia) image="$IMAGE_NVIDIA"; devices='--gpus all'; node=/dev/nvidiactl; one_stage=0 ;;
            amd)    image="$IMAGE_AMD"; devices='--device=/dev/kfd --device=/dev/dri'; node=/dev/kfd; one_stage=1 ;;
            *) echo "##vso[task.logissue type=error]agent GPU_VENDOR '${GPU_VENDOR:-}' is not nvidia or amd"; exit 1 ;;
          esac
          if [[ "$IT_EXPECTED_VENDOR" != any && "$IT_EXPECTED_VENDOR" != "$GPU_VENDOR" ]]; then
            echo "##vso[task.logissue type=error]demanded $IT_EXPECTED_VENDOR, agent reports $GPU_VENDOR"; exit 1
          fi
          test -e "$node" || { echo "##vso[task.logissue type=error]no ${node} on $(Agent.Name)"; exit 1; }
          [[ "$image" == *@sha256:* ]] || { echo "##vso[task.logissue type=error]image is not digest-pinned: ${image}"; exit 1; }
          sock="${DOCKER_HOST#unix://}"
          [[ -S "$sock" ]] || { echo "##vso[task.logissue type=error]no Docker socket at ${sock} (DOCKER_HOST)"; exit 1; }
          echo "agent $(Agent.Name): vendor ${GPU_VENDOR}, image ${image}"
          echo "##vso[task.setvariable variable=IT_GPU_VENDOR]$GPU_VENDOR"
          echo "##vso[task.setvariable variable=IT_IMAGE]$image"
          echo "##vso[task.setvariable variable=IT_DEVICE_OPTIONS]$devices"
          echo "##vso[task.setvariable variable=IT_GPU_ONE_STAGE]$one_stage"
          echo "##vso[task.setvariable variable=IT_DOCKER_SOCK]$sock"
        env:
          IMAGE_NVIDIA: ${{ parameters.images.nvidia }}
          IMAGE_AMD: ${{ parameters.images.amd }}
        displayName: 'Select runtime from agent vendor'

      - bash: |
          set -euo pipefail
          docker pull "$(IT_IMAGE)"
          hf_cache="/opt/az_pipeline_agent/_work/hf_cache/$(Agent.Name)"
          mkdir -p "$hf_cache" "$(Build.ArtifactStagingDirectory)/evidence"
          # An AMD host names the devices its lease tool cannot discover, and the devices ROCr may use.
          extra=()
          [[ -r /tmp/di_leases/devices.inventory ]] && extra+=(-e "GPU_LEASE_DEVICES=$(cat /tmp/di_leases/devices.inventory)")
          [[ -n "${ROCR_VISIBLE_DEVICES:-}" ]] && extra+=(-e "ROCR_VISIBLE_DEVICES=${ROCR_VISIBLE_DEVICES}")
          # sleep outlives the job timeout by 5 minutes, so a container leaked by an agent crash exits on its own and
          # the kernel drops its lease locks.
          # shellcheck disable=SC2086
          docker run -d --rm --name "$(IT_CTR)" $(IT_DEVICE_OPTIONS) --shm-size=512m \
            -v "$(Build.SourcesDirectory):$(Build.SourcesDirectory)" -w "$(Build.SourcesDirectory)" \
            -v "${hf_cache}:/opt/interpretune/hf_cache:rw" \
            -v /tmp/di_leases:/gpu_leases \
            -v /opt/az_pipeline_agent/gpu_lease.sh:/gpu_lease_tool:ro \
            -v "$(IT_DOCKER_SOCK):/var/run/docker.sock" \
            -v "$(Build.ArtifactStagingDirectory)/evidence:/evidence" \
            -e HF_HOME=/opt/interpretune/hf_cache -e HF_DATASETS_CACHE=/opt/interpretune/hf_cache/datasets \
            -e HF_HUB_CACHE=/opt/interpretune/hf_cache/hub -e XDG_CACHE_HOME=/opt/interpretune/hf_cache \
            -e APPLY_POST_UPGRADES=false -e COVERAGE_CORE=sysmon \
            -e IT_GPU_VENDOR="$(IT_GPU_VENDOR)" -e IT_IMAGE="$(IT_IMAGE)" "${extra[@]}" \
            "$(IT_IMAGE)" sleep $(( (${{ parameters.timeoutInMinutes }} + 5) * 60 ))
        displayName: 'Start job container'

      # Backend truth before anything else: the torch build must match the vendor the agent reported, with both devices.
      - bash: |
          bash .azure-pipelines/scripts/ctr.sh 'source /tmp/venvs/it_dev/bin/activate && python - <<"PY"
          import os
          import torch
          expected = os.environ["IT_GPU_VENDOR"]
          actual = "amd" if torch.version.hip else "nvidia" if torch.version.cuda else "cpu"
          assert actual == expected, (expected, actual, torch.__version__)
          assert torch.cuda.device_count() >= 2, torch.cuda.device_count()
          print({"torch": torch.__version__, "cuda": torch.version.cuda, "hip": torch.version.hip,
                 "devices": [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]})
          PY'
        displayName: 'Verify backend'

      - ${{ each step in parameters.steps }}:
          - ${{ step }}

      # Release evidence is published only by vendor-demanded release legs, under the vendor named by the demand. Every
      # other class publishes under the vendor the agent actually reported.
      - ${{ if eq(parameters.jobClass, 'ci-release') }}:
          - publish: $(Build.ArtifactStagingDirectory)/evidence
            artifact: it-release-${{ parameters.vendor }}-$(System.JobAttempt)
            condition: and(always(), eq(variables['IT_PHASES_COLLECTED'], 'true'))
            displayName: 'Publish release phase evidence'
      - ${{ if ne(parameters.jobClass, 'ci-release') }}:
          - publish: $(Build.ArtifactStagingDirectory)/evidence
            artifact: it-${{ parameters.jobName }}-$(IT_GPU_VENDOR)-$(System.JobAttempt)
            condition: and(always(), eq(variables['IT_PHASES_COLLECTED'], 'true'))
            displayName: 'Publish phase evidence'

      - bash: |
          # Release every host lease this job may hold, then remove the container (which frees them anyway).
          bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/gpu_stage_lease.sh release all' || true
          docker rm -f "$(IT_CTR)" >/dev/null 2>&1 || true
        condition: always()
        displayName: 'Release host leases and remove container'
