# PATH FILTERS AND PULL REQUESTS -- read before assuming a docs push will be skipped.
#
# For a `pr:` trigger these filters are evaluated against the PULL REQUEST's cumulative diff, not
# against the delta of the push that fired it. A pipeline validates the merge commit, so once a PR
# touches anything under `src/**` every subsequent push re-triggers it -- including a docs-only one.
#
# `[skip ci]` does NOT rescue this either. Microsoft documents that PR-triggered pipelines run on the
# merge commit "regardless if there exist pushed commits whose messages or descriptions contain
# [skip ci]"; the skip tokens only suppress CI (branch) triggers.
#
# What the filters DO buy is skipping a PR whose whole diff is docs, so the exclusions below are
# still worth stating explicitly rather than relying on the include list not matching.
# NO `main` IN THE CI TRIGGER (2026-09-28). The self-hosted GPU agent is one serial slot shared across
# repositories, and a post-merge main build re-ran trees that the merged PR's gate had just validated on
# its merge ref: several such builds queued per day, each costing a full slot or a manual rejection.
# Main is validated by the PR gates (run on the merge commit), release/tag builds, and a MANUAL run
# (`az pipelines run --branch main`) queued when it adds coverage and the agent is otherwise idle.
trigger:
  branches:
    include:
      - release/*
      - refs/tags/*
  paths:
    include:
      - setup.*
      - requirements.txt
      - pyproject.toml
      - .codecov.yml
      - tests/**
      - src/**
      - requirements/**
      - .azure-pipelines/**
    exclude:
      - scripts/**
      - docs/**
      # `**/*.md` and not `*.md`: Azure matches a path filter against the whole root-relative path, so
      # the bare form covers only the repository root and a Markdown file under `src/**` still matched
      # the include above it. Thirteen such files exist, and each spent a full serial slot per edit.
      - "**/*.md"

pr:
  branches:
    include:
      # - '*'
      - main
      - release/*
  paths:
    include:
      - setup.*
      - requirements.txt
      - pyproject.toml
      - .codecov.yml
      - tests/**
      - src/**
      - requirements/**
      - .azure-pipelines/**
    exclude:
      - scripts/**
      # Skips a PR whose ENTIRE diff is documentation, Markdown at any depth included (same reason as
      # the `**/*.md` form under `trigger:`). It does not skip a docs push to a PR that also touches
      # src -- see the note above the `trigger:` block for why that is not achievable here.
      - docs/**
      - "**/*.md"
  drafts: false  # Only run for PRs that are "ready for review"
  #
  # Observed reporting behaviour, which is worth knowing when a PR seems not to have run:
  #   - diff matches an include and no exclude  -> the pipeline runs
  #   - diff matches nothing, or only excludes  -> NO build, but a NEUTRAL check still posts
  # So a NEUTRAL row means "evaluated and skipped". The absence of ANY row means the pipeline was
  # never evaluated, which is a different thing and is not something these filters produce.
  #
  # Note the consequence: with no required status checks configured, a pull request whose GPU build
  # never ran still reports a clean, mergeable state. "All checks green" and "everything that should
  # run, ran" are different claims and only the first is visible. Before merging on a green rollup,
  # confirm the Azure check is PRESENT, not merely non-failing.

# SCHEDULED FULL RUNS. Pull request gates run only the GPU tests their change selects
# (tests/gpu_ci/plan_gpu_run.py), so a regression a selection misses, and the combined tree of independently gated
# merges, surface here: nightly with the full GPU phases, weekly with the extended tiers as well. `always: false`
# runs a schedule only when main changed since its last successful run, and `batch: true` keeps runs from piling up.
# Scheduled runs still pass the self-hosted pool's approval check. They take the same host leases as a gate, but wait
# up to two hours and then CANCEL rather than fail, so a long local job costs one night's run, not a red build.
# The planner recognises the weekly run by its display name: keep the two in step.
schedules:
  - cron: "0 10 * * 1-6"
    displayName: "nightly full GPU run"
    branches:
      include:
        - main
    always: false
    batch: true
  - cron: "0 10 * * 0"
    displayName: "weekly extended GPU run"
    branches:
      include:
        - main
    always: false
    batch: true

parameters:
  - name: reset_hf_cache
    displayName: Reset HF Cache
    type: boolean
    default: false
  # `auto` selects per change on pull request gates and runs the full set on every other build; `full` forces the
  # full set. A pull request can also force it with the `ci:gpu-full` label.
  - name: mode
    displayName: GPU test selection
    type: string
    default: auto
    values:
      - auto
      - full
  - name: extended
    displayName: Also run the extended GPU tiers (optional tests, full profiling)
    type: boolean
    default: false

jobs:
  - job: pytest
    strategy:
      matrix:
        PyTorch_latest:
          image: speediedan/interpretune:py3.13-pt2.13.0-azpl-init
          scope: ""
    # A gate can wait up to 40 minutes for each host lease before the GPU phases, on top of a run of about 35
    # minutes (install plus the three GPU phases). A scheduled run waits up to two hours for the leases, and the
    # weekly and release runs add the extended tiers, so those builds get more room.
    ${{ if or(eq(variables['Build.Reason'], 'Schedule'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(parameters.extended, true)) }}:
      timeoutInMinutes: 300
    ${{ else }}:
      timeoutInMinutes: 120
    cancelTimeoutInMinutes: 2

    pool:
      name: default

    container:
      image: $(image)
      mapDockerSocket: false
      volumes:
        - /var/run/user/998/docker.sock:/var/run/docker.sock
        - /opt/az_pipeline_agent/_work/hf_cache/$(Agent.Name):/opt/interpretune/hf_cache:rw
        # Host GPU-lease rendezvous directory. `flock` works on the inode, so a bind-mounted lock file
        # interlocks between this container and processes on the host -- which is what lets this job
        # serialize against local multi-GPU runs (this host is shared with finetuning-scheduler) WITHOUT
        # any change to the agent installation. Fails open if absent.
        - /tmp/di_leases:/gpu_leases
      options: --gpus all --shm-size=512m
      env:
        HF_HOME: /opt/interpretune/hf_cache
        HF_DATASETS_CACHE: /opt/interpretune/hf_cache/datasets
        HF_HUB_CACHE: /opt/interpretune/hf_cache/hub
        XDG_CACHE_HOME: /opt/interpretune/hf_cache
        APPLY_POST_UPGRADES: "false"
        # sysmon coverage core (coverage>=7.4, py>=3.12): immune to nnsight's sys.settrace(None)
        # trace-teardown wipe of the default settrace-based core (see gen_it_coverage.sh)
        COVERAGE_CORE: sysmon

    # WORKSPACE REUSE -- read this if a build fails at `Checkout ... to s` in well under a minute.
    #
    # `clean: outputs` clears build outputs and KEEPS the source folder, so each build re-syncs an
    # existing checkout instead of re-cloning. That is deliberate: forcing a full re-clone on every
    # GPU build is a standing cost paid to guard against a rare event, and the rare event is cheap to
    # recover from by hand.
    #
    # The rare event: if a build is killed mid-checkout (host OOM is the way this happens here, see
    # the memory note on the lease step below), git can be left having written part of `.git`. A
    # `.git` with no `HEAD` and no `config` is not a repository, so the next build's `git clean -ffdx`
    # and `git reset --hard` both fail, and the agent's fallback of deleting the source folder can
    # fail too if the dead build left files owned by the container's uid rather than the agent's.
    #
    # Diagnosing it, in order:
    #   1. Prefer the task result over inspecting the directory: if the most recent build's Checkout
    #      task SUCCEEDED, the workspace is healthy and the problem is elsewhere.
    #   2. If you do inspect, confirm `.git/HEAD` and `.git/config` report "No such file or directory"
    #      and NOT "Permission denied" -- an access limit looks identical from outside.
    #   3. A workspace that is mid-checkout right now has the SAME signature as a corrupt one (small,
    #      those two files absent). Check that no build is in flight before concluding anything, and
    #      re-check immediately before acting rather than relying on an earlier look.
    #
    # Recovery is to delete the agent's source folder (`<agent>/_work/<n>/s`), which needs an account
    # with agent-uid access. Whether a rerun ALONE clears it is untested: the one observed occurrence
    # was cleared by hand before any rerun met it. If it recurs, rerunning once before deleting costs
    # about a minute and would settle that.
    workspace:
      clean: outputs

    # NO CPU-ONLY PHASE HERE. The CPU suite runs on the GitHub-hosted matrix, which triggers on every pull
    # request this pipeline does (the path filters match apart from each file's own definition) and runs on
    # the merge ref as this job does. A per-test comparison on one commit found this job's CPU-only phase ran
    # exactly two tests the hosted Linux job did not, both skipped there only for want of a warmed tokenizer
    # (now in tests/hf_warm_manifest.yaml), while it cost about half of every build's test time.
    steps:
      # A pull request build checks out the merge commit; the GPU run planner diffs it against its first parent (the
      # target branch), which needs both parents fetched.
      - checkout: self
        fetchDepth: 2

      - bash: |
          echo "=== identity ==="
          id || true
          groups || true
          echo "=== mount/dir status ==="
          ls -ld /opt/interpretune /opt/interpretune/hf_cache 2>/dev/null || true
          stat -c "%n -> %U:%G %a" /opt/interpretune /opt/interpretune/hf_cache 2>/dev/null || true
          echo "=== touch test  ==="
          if touch /opt/interpretune/hf_cache/.write_test 2>/dev/null; then
            echo WRITE_OK
          else
            echo WRITE_FAIL
            echo "ERROR: Unable to write to /opt/interpretune/hf_cache"
            exit 1
          fi

        displayName: 'Verify runner hf_cache mount & permissions'

      - bash: |
          echo "=== Probing HF cache lock file accessibility ==="
          LOCK_FILE=$(find /opt/interpretune/hf_cache/datasets -name "*super_glue*rte*.lock" -type f 2>/dev/null | head -1)
          if [ -n "$LOCK_FILE" ]; then
            echo "Found lock file: $LOCK_FILE"
            ls -l "$LOCK_FILE"
            echo "Testing read access..."
            if cat "$LOCK_FILE" >/dev/null 2>&1; then
              echo "✓ Read access OK"
            else
              echo "✗ Read access FAILED (exit code: $?)"
            fi
            echo "Testing write access..."
            if touch "$LOCK_FILE" 2>&1; then
              echo "✓ Write access OK"
            else
              echo "✗ Write access FAILED (exit code: $?)"
              echo "LOCK FILE INACCESSIBLE - attempting to fix permissions"
              # Try to fix permissions before falling back to cache reset
              echo "Fixing HF cache dataset permissions..."
              # Fix lock files to be group-writable
              sudo find /opt/interpretune/hf_cache/datasets -type f -name "*.lock" -exec chmod 664 {} \; 2>/dev/null || true
              # Ensure directories have SGID and group write
              sudo find /opt/interpretune/hf_cache/datasets -type d -exec chmod g+ws {} \; 2>/dev/null || true
              echo "Permissions fix completed"
              # Test again after fix
              if touch "$LOCK_FILE" 2>&1; then
                echo "✓ Write access restored after permission fix"
              else
                echo "✗ Write access still failed - triggering cache reset"
                echo "##vso[task.setvariable variable=FORCE_CACHE_RESET]1"
              fi
            fi
            echo "Lock file ownership details:"
            stat "$LOCK_FILE" || true
            echo "Current user context:"
            id
          else
            echo "No super_glue RTE lock files found in cache"
          fi
        displayName: 'Debug: Probe HF cache lock file permissions'
        continueOnError: true

      - bash: |
          if [ "$FORCE_CACHE_RESET" = "1" ] || [ "${{ parameters.reset_hf_cache }}" = "True" ]; then
            echo "Clearing HF cache due to: $([ "$FORCE_CACHE_RESET" = "1" ] && echo "inaccessible lock files" || echo "manual reset parameter")"
            rm -rf /opt/interpretune/hf_cache/* || true
          else
            echo "HF cache reset not required"
          fi
        displayName: 'Maybe reset HF cache'

      - bash: |
          set -e  # Exit on any error
          source /tmp/venvs/it_dev/bin/activate

          echo "=== Installing interpretune in editable mode with git dependencies ==="
          if ! uv pip install -e . --group git-deps; then
            echo "ERROR: Failed to install interpretune in editable mode"
            exit 1
          fi
          echo "✓ Interpretune installation completed"

          echo "=== Installing locked CI requirements ==="
          if ! uv pip install -r requirements/ci/requirements.txt; then
            echo "ERROR: Failed to install locked CI requirements"
            echo "Checking for permission issues in venv..."
            find /tmp/venvs/it_dev -type d -name __pycache__ ! -writable 2>/dev/null | head -20
            exit 1
          fi
          echo "✓ CI requirements installation completed"

          echo "=== Installed packages ==="
          uv pip list

          echo "=== Verifying critical packages ==="
          for pkg in coverage pytest torch transformers; do
            if uv pip show "$pkg" >/dev/null 2>&1; then
              echo "✓ $pkg is installed"
            else
              echo "✗ ERROR: $pkg is NOT installed"
              exit 1
            fi
          done
          echo "✓ All critical packages verified"
        displayName: 'Install dependencies'

      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          python requirements/utils/collect_env_details.py
        displayName: 'Env details and package versions'

      # Decide what this run executes and export it to the steps below (see tests/gpu_ci/plan_gpu_run.py): the full
      # GPU set, only the tests a pull request's change selects, or none of them; whether the extended tiers run; and
      # the lease-wait policy. Anything the planner cannot establish runs the full set, named in this step's log.
      - bash: |
          set -e
          source /tmp/venvs/it_dev/bin/activate
          # The agent checks the repository out on the host, so inside this rootless container the checkout belongs to
          # another uid and git refuses it as "dubious ownership". Trust it for this command only: GIT_CONFIG_* is
          # command-line scope, which git honours for safe.directory, and nothing global changes.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$(pwd)" \
            python -m tests.gpu_ci.plan_gpu_run --mode "${{ parameters.mode }}" --extended "${{ parameters.extended }}"
        displayName: 'Plan the GPU run'

      - bash: |
          set -e
          source /tmp/venvs/it_dev/bin/activate
          # Suite resolves Hub experiment seeds offline from this mount, and nothing else
          # populates components on it: models/datasets persist across builds, pinned
          # component revisions do not. Warm them (small, pinned, idempotent) so the
          # Testing phases never inherit another build's refs/main roulette.
          python scripts/warm_hf_cache.py --components-only
        displayName: 'Warm Hub components from manifest'
        env:
          HF_TOKEN: $(HF_MCP_TOKEN_RW)

      # Serialize the GPU phases against local work on this shared host (finetuning-scheduler uses it too).
      # The agent runs one Azure job at a time, so this guards only against interactive/agent sessions. Two
      # leases, taken in the host tool's fixed order (gpu, then cpu-heavy) so a local caller taking both in that
      # order cannot deadlock against this job: `gpu` for the devices, and `cpu-heavy` for HOST MEMORY, since a
      # full local suite beside this job's suite once OOM-killed both sides. Nothing before this step needs
      # either: install and cache warming are light. Waiting here for tens of minutes behind a local GPU job is
      # the lease working, not a hung build.
      - bash: |
          source scripts/gpu_lease_wrap.sh
          # Fail CLOSED: a bash step's result is its last command's exit code, so a timed-out `gpu` acquire
          # followed by a succeeding `cpu-heavy` acquire used to read as success, and the GPU phases then ran
          # unleased beside whoever held the lease (all CUDA out-of-memory, with nothing in the timeline saying
          # the lease was missed). Each acquire's status is checked before the next. The `condition: always()`
          # cleanup below releases whatever is held, so the failure path leaves no lease.
          #
          # A gate waits up to IT_GPU_LEASE_WAIT seconds for EACH lease and fails on a timeout. A scheduled run
          # shares one IT_GPU_LEASE_WAIT deadline across both and, on a timeout, cancels itself: the next scheduled
          # run is a fresh attempt, so a long local job should cost one night's run, not a red build.
          deadline=$(( $(date +%s) + IT_GPU_LEASE_WAIT ))
          wait_for() {  # <pidfile> <lease>
            local wait=$IT_GPU_LEASE_WAIT
            if [ "$IT_GPU_LEASE_ON_TIMEOUT" = cancel ]; then
              wait=$(( deadline - $(date +%s) ))
              [ "$wait" -gt 60 ] || wait=60
            fi
            ci_gpu_lease_acquire /gpu_leases "$1" "$wait" "azure-it-$(Build.BuildId)" "$2"
          }
          wait_for /tmp/azp_gpu_lease.pid gpu
          rc=$?
          if [ "$rc" -eq 0 ]; then
            wait_for /tmp/azp_cpu_heavy_lease.pid cpu-heavy
            rc=$?
          fi
          [ "$rc" -eq 0 ] && exit 0
          if [ "$rc" -eq 75 ] && [ "$IT_GPU_LEASE_ON_TIMEOUT" = cancel ]; then
            echo "##vso[task.logissue type=warning]The host leases stayed busy for ${IT_GPU_LEASE_WAIT}s (holder above); cancelling this scheduled run rather than failing it."
            curl -sS -f -X PATCH -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" -H "Content-Type: application/json" \
              -d '{"status": "cancelling"}' \
              "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)?api-version=7.1" >/dev/null \
              && sleep 300
            echo "ERROR: the cancel request failed or did not take effect; failing closed instead."
            exit 1
          fi
          exit "$rc"
        displayName: 'Acquire host GPU lease'
        condition: and(succeeded(), ne(variables['IT_GPU_SELECTION_MODE'], 'none'))
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          export IT_RUN_CUDA_TESTS=1
          # Run regular CUDA-gated tests separately to reduce peak memory pressure while preserving GPU coverage.
          python -m pytest --cov=src/interpretune --cov-append --cov-report= tests src/it_examples/tests -v --durations=50 --reruns 2 --reruns-delay 5
          rc=$?
          # A selected run may select no cuda-marked test (pytest exit 5). Only then is an empty phase a pass: on a full
          # run an empty phase means the collector broke.
          if [ "$rc" -eq 5 ] && [ "$IT_GPU_SELECTION_MODE" = selected ]; then
            echo "No cuda-marked test is selected by this change."
            exit 0
          fi
          exit "$rc"
        displayName: 'Testing: standard gpu cuda-marked'
        condition: and(succeeded(), ne(variables['IT_GPU_SELECTION_MODE'], 'none'))
        env:
          # gated-model tests (llama3/gemma) and the notebook/example tests run in this phase and
          # read these secrets; without the mapping they fail with a KeyError on the secret's name
          HF_GATED_PUBLIC_REPO_AUTH_KEY: $(HF_GATED_PUBLIC_REPO_AUTH_KEY)
          # HF_TOKEN feeds from HF_MCP_TOKEN_RW so the J-space steering section can pull the PRIVATE
          # speediedan/jlens_steering_ops collection (#273). The gated key cannot read it (probed).
          # Revert to a read-scoped token at the #261 public flip.
          HF_TOKEN: $(HF_MCP_TOKEN_RW)

      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          export HF_GATED_PUBLIC_REPO_AUTH_KEY=$HF_GATED_PUBLIC_REPO_AUTH_KEY
          export HF_TOKEN=$HF_TOKEN
          # --allow-failures: run every test and fail the step at the end, so one failure cannot hide the result of
          # every test after it. The script still exits non-zero when anything failed. --allow-empty only on a
          # selected run, which may select no standalone test; on a full run an empty phase means the collector broke.
          empty=(); [ "$IT_GPU_SELECTION_MODE" = selected ] && empty=(--allow-empty)
          bash ./tests/special_tests.sh --mark_type=standalone --allow-failures "${empty[@]}"
        displayName: 'Testing: standalone gpu'
        condition: and(succeeded(), ne(variables['IT_GPU_SELECTION_MODE'], 'none'))
        env:
          HF_GATED_PUBLIC_REPO_AUTH_KEY: $(HF_GATED_PUBLIC_REPO_AUTH_KEY)
          HF_TOKEN: $(HF_MCP_TOKEN_RW)  # private jlens collection until #261; see cuda-marked phase note

      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          empty=(); [ "$IT_GPU_SELECTION_MODE" = selected ] && empty=(--allow-empty)
          bash ./tests/special_tests.sh --mark_type=profile_ci --allow-failures "${empty[@]}"
        displayName: 'Testing: CI Profiling'
        condition: and(succeeded(), ne(variables['IT_GPU_SELECTION_MODE'], 'none'))

      # The extended tiers no gate runs: the full profiling tier and the optional GPU tests (the SAELens notebooks
      # among them). Weekly, on release and tag builds, and on a manual run with `extended`.
      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          mkdir -p /__w/_temp/kernel_cache
          bash ./tests/special_tests.sh --mark_type=profile --allow-failures
        displayName: 'Testing: extended profiling'
        condition: and(succeeded(), eq(variables['IT_GPU_EXTENDED'], '1'))
        env:
          PYTORCH_KERNEL_CACHE_PATH: "/__w/_temp/kernel_cache"

      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          bash ./tests/special_tests.sh --mark_type=optional --allow-failures
        displayName: 'Testing: extended optional'
        condition: and(succeeded(), eq(variables['IT_GPU_EXTENDED'], '1'))
        env:
          HF_GATED_PUBLIC_REPO_AUTH_KEY: $(HF_GATED_PUBLIC_REPO_AUTH_KEY)
          HF_TOKEN: $(HF_MCP_TOKEN_RW)

      - bash: |
          source /tmp/venvs/it_dev/bin/activate
          python -m coverage report
          python -m coverage xml
          python -m coverage html

          curl https://keybase.io/codecovsecurity/pgp_keys.asc | gpg --no-default-keyring --keyring trustedkeys.gpg --import
          curl -Os https://cli.codecov.io/latest/linux/codecov
          curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM
          curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM.sig
          gpg --no-default-keyring --keyring trustedkeys.gpg --verify codecov.SHA256SUM.sig codecov.SHA256SUM
          shasum -a 256 -c codecov.SHA256SUM
          chmod +x codecov
          # A selected run covers only part of the GPU set, so it uploads under its own flag: under `gpu` it would read
          # as a coverage drop.
          flags=(-F gpu -F pytest); name=GPU-coverage
          if [ "$IT_GPU_SELECTION_MODE" = selected ]; then flags=(-F gpu-selected); name=GPU-selected-coverage; fi
          ./codecov upload-process --slug 'speediedan/interpretune' -t $CODECOV_TOK --commit-sha $(Build.SourceVersion) --git-service 'github' -n "$name" "${flags[@]}" --env 'linux,azure' -f 'coverage.xml'
        displayName: 'Upload Coverage to Codecov'
        condition: and(succeeded(), ne(variables['IT_GPU_SELECTION_MODE'], 'none'))
        env:
          CODECOV_TOK: $(CODECOV_TOKEN)
      # - bash: |
      #     set -e
      #     . /tmp/venvs/it_dev/bin/activate
      #     python -m coverage run --append --source src/interpretune -m pytest src/it_examples -v
      #   # condition: notIn(variables['scope'], '2.0.1')
      #   displayName: 'Testing: Examples'


      - bash: |
          # since we use rootless docker and userns-remapping, we need to ensure all files/directories in previous
          # steps that may have been written with Azure's `az_pipeline_agent_azpcontainer` user (100997 in the host
          # subuid range) are chmod'd or removed
          # some directories created by the userns-remapped container uids are removed by the agent at the beginning
          # of every run (in a step we don't control) so we proactively clean those up in this step (`.pytest_cache`
          # is the only folder in this category currently)
          echo "Adjusting ownership/permissions..."
          sudo chmod -R 775 /__w/2/s || true
          echo "Cleaning up ephemeral directories..."
          sudo rm -rf /__w/2/s/.pytest_cache || true

          echo "Fixing HF cache dataset permissions for next run..."
          # Fix lock files to be group-writable
          sudo find /opt/interpretune/hf_cache/datasets -type f -name "*.lock" -exec chmod 664 {} \; 2>/dev/null || true
          # Ensure directories have SGID and group write
          sudo find /opt/interpretune/hf_cache/datasets -type d -exec chmod g+ws {} \; 2>/dev/null || true

          # Release both host leases. Belt-and-braces: if this job dies or its container is torn
          # down, every process inside dies too and the kernel frees the leases automatically.
          source scripts/gpu_lease_wrap.sh 2>/dev/null && {
            ci_gpu_lease_release /gpu_leases /tmp/azp_gpu_lease.pid gpu
            ci_gpu_lease_release /gpu_leases /tmp/azp_cpu_heavy_lease.pid cpu-heavy; } || true
          echo 'Agent workspace and HF cache cleanup completed'
        condition: always()
        displayName: 'Cleaning up agent workspace'
