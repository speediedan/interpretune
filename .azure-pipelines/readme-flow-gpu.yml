# Tier 2 of the user-install validation lane (issue #270). Tier 1 is
# .github/workflows/readme-flow-smoke.yml.
#
# WHAT THIS ADDS OVER TIER 1: the GPU-gated half. Tier 1 is hosted and CPU-only, so it validates config
# PARSING (all 15 shipped configs through their real argv surface) while config INSTANTIATION skips --
# `test_cli_unit_configs` and `test_cli_configs` are both `RunIf(min_cuda_gpus=1)`, and the four
# `bf16_cuda` notebooks skip too. Instantiation is where a resolver-shaped defect would surface, so
# leaving it uncovered was the known gap in Tier 1 rather than an oversight.
#
# WHY A SEPARATE PIPELINE rather than a fifth task in gpu-tests.yml: Azure path filters and triggers are
# per-pipeline, not per-task. gpu-tests.yml runs on every PR touching src/**; this must run only on
# releases and manual dispatch, and the two cannot coexist in one definition. Same reason Tier 1 is its
# own workflow rather than a job in env-build-smoke.yml.
#
# CRITICAL, AND THE WHOLE POINT: this pipeline installs the README way. It must NOT install from
# requirements/ci/requirements.txt (what gpu-tests.yml does) nor via build_it_env.sh --from-source (what
# env-build-smoke does). Those resolve supersets of what a user gets -- the from-source path pulls the
# vendored SAELens Poetry export, which is how pytest-timeout, docstr-coverage and ruff reach
# environments while being declared in neither pyproject.toml nor the CI lock. A Tier 2 that installed
# either way would pass while blind to the thing it exists to detect, so the absence of that residue is
# ASSERTED below rather than merely intended.

# Releases, pre-release and manual dispatch only. No `pr:` trigger by design: this is a release gate,
# not a per-PR check, and it consumes a GPU slot on the shared self-hosted agent.
trigger:
  branches:
    include:
      - refs/tags/*
      - release/*
pr: none

parameters:
  # The same digest-pinned pair gpu-tests.yml runs (keep the two in step). This pipeline demands an NVIDIA agent, so
  # only the NVIDIA image runs here; the template takes both.
  - name: images
    type: object
    default:
      nvidia: "speediedan/interpretune:py3.13-pt2.15.0-azpl-init@sha256:e70fa08fe772ae6e48f892b03f64cbb8de4a1882fe369b6abb6cfa55b56cbda0"
      amd: "speediedan/interpretune:py3.13-pt2.15.0-rocm10.0-azpl-init@sha256:1bc21baf182878047f1260e5d6d45d6ea8268d89b48a18717555aa233e3bf62b"

# The any-vendor template (#703), as a vendor-demanded release job: README.md documents a CUDA install (the default
# index's torch), so the README flow can only pass on an NVIDIA agent until README.md documents a ROCm install too, and
# this is a release gate, so it takes the release job class. The template starts the container (the approval gate is
# attached to the self-hosted POOL, so a GPU pipeline structurally cannot ship ungated); every step below runs inside
# it through .azure-pipelines/scripts/ctr.sh, with its logic in .azure-pipelines/scripts/readme_flow.sh.
jobs:
  - template: templates/gpu-job.yml
    parameters:
      jobName: readme_flow_gpu
      displayName: 'README flow (GPU)'
      vendor: nvidia
      jobClass: ci-release
      images: ${{ parameters.images }}
      timeoutInMinutes: 100
      fetchDepth: 1
      steps:
        # The whole server and host memory, so this serializes against local multi-GPU runs and the other pipelines.
        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh lease'
          displayName: 'Acquire host GPU lease'

        # Extracted, never duplicated. A hardcoded copy would let README.md drift while this pipeline kept testing the
        # previous command and stayed green -- the exact failure class this lane exists to catch. Asserting exactly one
        # match means a reshaped install section fails loudly rather than silently testing nothing.
        #
        # README.md documents TWO installs: a notebook install (`.[examples]`) and the fuller one selected here. Which
        # one this lane needs is determined rather than preferred: the provenance assertion two steps down imports
        # `lightning`, carried only by the `lightning` EXTRA, and `papermill`, carried only by the `test` GROUP.
        # Selecting on `--group test` picks the only line that can satisfy it. Do NOT relax this to "take the first
        # match": that would pass extraction and then fail the provenance assertion, turning a precise error into a
        # confusing one.
        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh extract'
          displayName: 'Extract the install command from README.md'

        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh install'
          displayName: 'Install exactly what README.md says'

        # A version string matches whether or not the package came from the env under test; only the resolved path
        # proves which code would run.
        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh provenance'
          displayName: 'Assert provenance and that CUDA is actually present'

        # Positive guard, not an omission. If these appear, this pipeline has drifted into a dev flow and is no longer
        # testing what a user gets.
        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh residue'
          displayName: 'Assert no dev-flow residue'

        # IT_RUN_CUDA_TESTS is deliberately NOT set. `tests/conftest.py` does `items[:] = [...]` for it, so it SELECTS
        # the cuda-marked set rather than adding to it, and setting it here would silently drop everything else from
        # the run. `RunIf(min_cuda_gpus=1)` is a runtime skipif on GPU availability, so simply having a GPU un-skips
        # these.
        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh cli'
          displayName: 'CLI instantiation (GPU-gated, the Tier 1 gap)'
          env:
            # Secrets must be mapped explicitly; without this they fail with KeyError (build 575).
            HF_GATED_PUBLIC_REPO_AUTH_KEY: $(HF_GATED_PUBLIC_REPO_AUTH_KEY)
            HF_TOKEN: $(HF_TOKEN)

        # 5 expected skips, all measured from a real run rather than anticipated:
        #   2  Optional/extended test execution
        #   2  Standalone execution
        #   1  test_circuit_tracer_w_neuronpedia_notebook, needs NEURONPEDIA_API_KEY
        # None is GPU-gated, so they skip on a GPU host too and are part of the pinned shape. The neuronpedia one skips
        # in EVERY environment: no workflow in this repo supplies that key, so exercising it would be a new credential
        # decision rather than a pipeline fix. Pinning it here keeps the assertion able to detect drift; it does not
        # endorse the gap.
        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/readme_flow.sh notebooks'
          displayName: 'Published notebooks (bf16_cuda)'
          env:
            HF_GATED_PUBLIC_REPO_AUTH_KEY: $(HF_GATED_PUBLIC_REPO_AUTH_KEY)
            HF_TOKEN: $(HF_TOKEN)
