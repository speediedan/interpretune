name: "Install CI Dependencies"
description: "Install Python dependencies for CI workflows"

inputs:
  python_version:
    description: "Python version to use"
    required: false
    default: "3.13"
  show_pip_list:
    description: "Whether to show package list output after installations"
    required: false
    default: "false"
  requirements_file:
    description: "Requirements file to install (requirements.txt or requirements-oldest.txt)"
    required: false
    default: "requirements.txt"

runs:
  using: "composite"
  steps:
    - name: Install uv and set Python version
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python_version }}
        activate-environment: true
        enable-cache: true

    - name: Check for torch prerelease configuration
      id: torch_pre
      shell: bash
      run: |
        TORCH_PRE_FILE="requirements/ci/torch-pre.txt"
        if [[ -f "${TORCH_PRE_FILE}" ]]; then
          # Read 3-line config: version, CUDA target, channel type
          # Using while-read loop instead of readarray for macOS bash 3.x compatibility
          i=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            case $i in
              0) TORCH_PRE_VERSION="$line" ;;
              1) TORCH_PRE_CUDA="$line" ;;
              2) TORCH_PRE_CHANNEL="$line" ;;
            esac
            # not ((i++)): its status is the pre-increment value, so the first pass (i=0) returns 1 and the
            # runner's `bash -e` ends the step. That stayed latent while torch-pre.txt had no active lines.
            i=$((i + 1))
          done < <(grep -v '^#' "${TORCH_PRE_FILE}" | grep -v '^$')
          if [[ -n "${TORCH_PRE_VERSION}" && -n "${TORCH_PRE_CHANNEL}" ]]; then
            echo "use_prerelease=true" >> $GITHUB_OUTPUT
            echo "version=${TORCH_PRE_VERSION}" >> $GITHUB_OUTPUT
            echo "channel=${TORCH_PRE_CHANNEL}" >> $GITHUB_OUTPUT
            echo "Torch prerelease configured: ${TORCH_PRE_VERSION} from ${TORCH_PRE_CHANNEL}"
          else
            echo "use_prerelease=false" >> $GITHUB_OUTPUT
            echo "No torch prerelease configured (incomplete torch-pre.txt)"
          fi
        else
          echo "use_prerelease=false" >> $GITHUB_OUTPUT
          echo "No torch prerelease configured (torch-pre.txt not found)"
        fi

    - name: Install torch prerelease (if configured)
      if: steps.torch_pre.outputs.use_prerelease == 'true'
      shell: bash
      run: |
        TORCH_VERSION="${{ steps.torch_pre.outputs.version }}"
        TORCH_CHANNEL="${{ steps.torch_pre.outputs.channel }}"
        # CI uses CPU-only torch for GitHub Actions runners. The CPU index labels its Linux and Windows
        # wheels `+cpu` but publishes the macOS arm64 wheel with no local label, so `==<v>+cpu` cannot
        # match there; macOS asks for the bare version from the same index.
        INDEX_URL="https://download.pytorch.org/whl/${TORCH_CHANNEL}/cpu"
        TORCH_SPEC="torch==${TORCH_VERSION}+cpu"
        if [[ "${RUNNER_OS}" == "macOS" ]]; then
          TORCH_SPEC="torch==${TORCH_VERSION}"
        fi
        echo "Installing torch prerelease: ${TORCH_SPEC} from ${TORCH_CHANNEL} channel..."
        uv pip install --prerelease=if-necessary-or-explicit "${TORCH_SPEC}" --index-url "${INDEX_URL}"

    - name: Install stable torch (if not using prerelease)
      if: steps.torch_pre.outputs.use_prerelease != 'true'
      shell: bash
      run: |
        echo "Installing stable torch with CPU backend..."
        uv pip install torch --torch-backend=cpu

    - name: Install project dependencies
      shell: bash
      run: |
        # Keep the whole torch family on the same index as the torch installed above. torchvision is
        # pulled in transitively here; without --torch-backend it resolves from default PyPI, which on
        # linux x86_64 is the CUDA build. Paired with the `+cpu` torch that is an ABI mismatch whose
        # only symptom is a missing operator registration at import time ("operator torchvision::nms
        # does not exist"). It stayed latent while the torch pin was old enough that the pin forced a
        # re-resolution back to the default-PyPI (CUDA) torch, making the pair accidentally consistent.
        #
        # Linux/Windows only: the PyTorch CPU index publishes no macOS wheels, so `--torch-backend=cpu`
        # there either fails to resolve a pinned torch outright or silently falls back to an older
        # version that does have macOS wheels. macOS gets CPU-only builds from default PyPI anyway, so
        # the mismatch this guards against cannot arise there.
        TORCH_BACKEND_FLAG=""
        if [[ "${RUNNER_OS}" != "macOS" ]]; then
          TORCH_BACKEND_FLAG="--torch-backend=cpu"
        fi
        echo "Torch backend flag for dependency resolution: '${TORCH_BACKEND_FLAG:-<none, macOS>}'"

        # interpretune editable with git-deps group (uv doesn't currently support url deps in locked reqs)
        echo "Installing interpretune in editable mode with any git url dependencies..."
        uv pip install -e . --group git-deps ${TORCH_BACKEND_FLAG}

        # The lockfile excludes torch (via --no-emit-package) but includes packages like
        # torch-tb-profiler that depend on torch but aren't on PyTorch's special index.
        echo "Installing locked CI requirements from ${{ inputs.requirements_file }}..."
        uv pip install -r "requirements/ci/${{ inputs.requirements_file }}" ${TORCH_BACKEND_FLAG}

        # the shared GPU release eligibility checker, for its contract test (CI only, never package metadata)
        echo "Installing the gpu-epsilon pin from requirements/ci/gpu_epsilon.txt..."
        uv pip install -r requirements/ci/gpu_epsilon.txt

    # The project install resolves torch's requirement again. It should find the prerelease already
    # satisfying it, but nothing at that step fails if a dependency pulls torch to a release it pairs
    # with instead, and the run would then test a torch nobody asked for while reading as a prerelease run.
    - name: Verify the configured torch prerelease survived the project install
      if: steps.torch_pre.outputs.use_prerelease == 'true'
      shell: bash
      run: |
        python - "${{ steps.torch_pre.outputs.version }}" <<'PY'
        import sys
        import torch
        expected = sys.argv[1]
        installed = torch.__version__.split("+")[0]
        print(f"torch {torch.__version__} (git {torch.version.git_version}) from {torch.__file__}")
        if installed != expected:
            sys.exit(f"torch-pre.txt configures torch {expected}, but {torch.__version__} is installed: "
                     "a dependency resolve replaced the prerelease")
        PY

    - name: Show package list
      if: inputs.show_pip_list == 'true'
      shell: bash
      run: |
        uv pip list
