name: Docs linkcheck

# Scheduled and NON-BLOCKING by construction: link rot is the observed failure mode of comparable
# notebook-docs pipelines (#226), but external hosts flake, so this never gates a PR. It runs on a
# weekly cron plus manual dispatch, and failure surfaces in the Actions tab rather than on any PR.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC (off the hour to dodge cron congestion)
  workflow_dispatch: {}

jobs:
  linkcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/docs.txt
      # Mirrors docs-build's install exactly: conf.py stages the example notebooks at import time,
      # so linkcheck sees the same staged tree (artifact lane preferred, publish fallback) that the
      # rendered site serves.
      - name: Install docs requirements
        run: |
          pip install -r requirements/docs.txt
          PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu pip install .
      - name: Run sphinx linkcheck
        env:
          SPHINX_MOCK_REQUIREMENTS: "1"
        run: |
          python -m sphinx -b linkcheck --keep-going docs/source docs/build/linkcheck
      - name: Upload linkcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: docs/build/linkcheck/output.*
