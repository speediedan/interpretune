name: regen-ci-req-check (scheduled)

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC on the 1st. MONTHLY, deliberately: the pins this refreshes are CI-only, every run
    # that finds drift costs a full matrix review, and a fortnightly cadence produced a standing
    # open PR that was continuously force-pushed rather than reviewed. `workflow_dispatch` covers
    # the case where a refresh is wanted sooner.
    - cron: '0 0 1 * *'

env:
  # A scheduled run is SKIPPED when the lock was refreshed inside this window, and waits for the next
  # cron. The monthly cadence already exists to stop a standing force-pushed PR nobody reviews; this
  # additionally suppresses a run that would regenerate pins a human just regenerated by hand.
  LOCK_MIN_AGE_DAYS: '14'

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED by the freshness gate below: the default depth-1 checkout has no history, so
          # `git log` for the lock file would report the checkout commit (or nothing) rather than when
          # the lock actually changed, and the gate would answer a question about the wrong commit.
          fetch-depth: 0

      - name: Check how recently the lock changed
        id: lock_age
        env:
          # Compared against the COMMIT date, never the filesystem mtime: actions/checkout writes every
          # file at clone time, so an mtime-based check reads "modified seconds ago" on every run and
          # would skip forever, silently and with no failing step to notice.
          LOCK_PATH: requirements/ci/requirements.txt
        run: |
          set -euo pipefail
          last_commit_epoch="$(git log -1 --format=%ct -- "$LOCK_PATH" || true)"
          if [ -z "$last_commit_epoch" ]; then
            echo "no commit found for $LOCK_PATH; not skipping (a missing history must not look fresh)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "age_days=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age_days=$(( ( $(date +%s) - last_commit_epoch ) / 86400 ))
          echo "age_days=${age_days}" >> "$GITHUB_OUTPUT"
          # A MANUAL dispatch always proceeds: `workflow_dispatch` exists for "a refresh is wanted
          # sooner", so gating it would remove the one escape hatch from this gate.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "event is ${{ github.event_name }}, not schedule: proceeding regardless of lock age (${age_days}d)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$age_days" -lt "${LOCK_MIN_AGE_DAYS}" ]; then
            echo "lock changed ${age_days}d ago (< ${LOCK_MIN_AGE_DAYS}d): skipping, next scheduled run will re-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "lock changed ${age_days}d ago (>= ${LOCK_MIN_AGE_DAYS}d): proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped for a recently refreshed lock
        if: steps.lock_age.outputs.skip == 'true'
        run: |
          echo "::notice::Skipped: requirements/ci/requirements.txt changed ${{ steps.lock_age.outputs.age_days }} \
          day(s) ago, inside the ${{ env.LOCK_MIN_AGE_DAYS }}-day window. The next scheduled run re-checks; \
          use workflow_dispatch to regenerate now."

      - name: Run regen and compute patch
        if: steps.lock_age.outputs.skip == 'false'
        uses: ./.github/actions/regen-ci-reqs
        id: regen_ci_reqs
        with:
          python_version: '3.13'
          ci_output_dir: requirements/ci
          patch_path: /tmp/regen_diff.patch

      - name: Create PR with updated pins
        if: steps.lock_age.outputs.skip == 'false' && steps.regen_ci_reqs.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          # Use a repository-scoped Personal Access Token (PAT) stored in secrets.IT_REGEN_PR_TOKEN.
          # This ensures the PR creation event is not suppressed by GitHub and will trigger downstream workflows.
          token: ${{ secrets.IT_REGEN_PR_TOKEN }}
          title: "[auto] regen pinned requirements"
          commit-message: "Auto-regenerate pinned requirements via scheduled regen-check"
          # STABLE branch name (deliberately not ${{ github.run_id }}-suffixed): create-pull-request
          # force-pushes this branch and UPDATES the existing open PR instead of opening a new one every
          # fortnight. The run-id-suffixed form left a long tail of abandoned regen/pinned-requirements-*
          # branches and duplicate PRs. delete-branch cleans up once the PR is merged or closed.
          branch: regen/pinned-requirements
          delete-branch: true
          # Restrict the commit to generated dependency state so an unrelated working-tree change can
          # never ride along.
          add-paths: |
            requirements/ci/requirements.txt
            requirements/ci/torch-override.txt
          body: |
            This PR was opened by the scheduled regen-ci-req-check workflow. It contains regenerated pinned requirement files.
            Please review tests and CI results before merging.

            This branch is reused by every scheduled run: if the pins drift again before this PR merges,
            the workflow force-pushes the refreshed pins here rather than opening a second PR.
          labels: automated, dependencies

      - name: Report no changes
        if: ${{ steps.lock_age.outputs.skip == 'false' && steps.regen_ci_reqs.outputs.changed == 'false' }}
        run: |
          echo "No CI pin file changes detected by regen-ci-req-check."
