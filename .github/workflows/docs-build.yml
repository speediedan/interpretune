name: Docs build

# REQUIRED smoke (not optional): docs are under active build-out and errors must surface on every
# change. Mirrors the Read the Docs build (mocked heavy deps).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/docs.txt

      # Cheap, stdlib-only, and BEFORE the heavy install so it fails fast. The docs render
      # docs/notebook_artifacts/ in preference to the publish lane (see conf.py), so editing a
      # notebook without rebuilding its artifact leaves the site showing the OLD text with a
      # perfectly green build and no error anywhere. This is the only thing that catches that.
      - name: Check notebook artifacts are not stale
        run: |
          python scripts/render_notebook_docs_artifacts.py --check-stale \
            || { echo "::error::A docs notebook artifact has drifted from its publish source. \
          Rebuild it with: python scripts/render_notebook_docs_artifacts.py --notebook <name>"; exit 1; }
      - name: Install docs requirements
        run: |
          pip install -r requirements/docs.txt
          PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu pip install .
      # conf.py stages docs/notebook_artifacts/ IN PREFERENCE TO the publish lane, so editing a
      # notebook without rebuilding its executed artifact leaves the site rendering the old text with
      # no build error anywhere -- the drift is invisible by construction.
      # Compares cell sources only (outputs ignored), so it needs no GPU and no execution.
      - name: Check executed notebook artifacts are not stale
        run: |
          python scripts/render_notebook_docs_artifacts.py --check-stale
      - name: Build docs (errors fail; warnings reported)
        env:
          SPHINX_MOCK_REQUIREMENTS: "1"
        run: |
          python -m sphinx -b html --keep-going docs/source docs/build
      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build
          retention-days: 7
