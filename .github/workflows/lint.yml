name: Lint

# DELIBERATELY UNFILTERED BY PATH, unlike type-check.yml and the docs workflows.
# `pre-commit run --all-files` checks the whole tree, so a path filter could only ever make this
# gate lie: a change that trips a hook in a path the filter excludes would report green. The run
# costs ~1 minute, so there is nothing to buy by narrowing it.
on:
  push:
    branches: [main, "release/*", "bugfix/*", "feature/*"]
  pull_request:
    branches: [main, "release/*", "bugfix/*", "feature/*"]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ ! (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-ubuntu-22.04-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-ubuntu-22.04-py3.13-

      # Pinned to the version in requirements/ci/requirements.txt so the gate runs the same
      # pre-commit a dev env installs. The HOOK versions are pinned separately, by `rev:` in
      # .pre-commit-config.yaml -- notably ruff at v0.12.10, which is the version the #139
      # docstring baseline in pyproject.toml was generated with. A baseline generated by one ruff
      # and enforced by another is not the same baseline.
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit==4.6.1

      # No repo dependencies are installed: every `language: system` hook here
      # (run_nbstripout_hook.py, publish_notebooks.py, check_benchmark_registry_isolation.py) is
      # stdlib-plus-git only, and pre-commit builds isolated envs for the rest. If a future hook
      # needs the package, this job needs an install step -- it will fail loudly rather than skip.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
