name: regen-ci-req-report (report-only)

on:
  workflow_dispatch:
  push:
    branches: [main, "release/*"]
    paths:
      - "setup.*"
      - "requirements.txt"
      - "pyproject.toml"
      - ".codecov.yml"
      - "tests/**"
      - "src/**"
      - "requirements/**"
      - ".github/workflows/ci_test-full.yml"
      # Exclude documentation-only files from triggering
      - "!docs/**"
      - "!**/*.md"
      - "!**/*.rst"
      - "!mkdocs.yml"
      - "!**/CHANGELOG.md"
      - "!**/CODE_OF_CONDUCT.md"
      - "!**/CONTRIBUTING.md"
      - "!**/LICENSE*"
      - "!scripts/**"
  pull_request:
    branches: [main, "release/*", "bugfix/*", "feature/*"]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "setup.*"
      - "requirements.txt"
      - "pyproject.toml"
      - ".codecov.yml"
      - "tests/**"
      - "src/**"
      - "requirements/**"
      - ".github/workflows/ci_test-full.yml"
      # Exclude documentation-only files from triggering
      - "!docs/**"
      - "!**/*.md"
      - "!**/*.rst"
      - "!mkdocs.yml"
      - "!**/CHANGELOG.md"
      - "!**/CODE_OF_CONDUCT.md"
      - "!**/CONTRIBUTING.md"
      - "!**/LICENSE*"
      - "!scripts/**"

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run regen and compute patch
        uses: ./.github/actions/regen-ci-reqs
        id: regen_ci_reqs
        with:
          python_version: '3.13'
          ci_output_dir: requirements/ci
          patch_path: /tmp/regen_diff.patch

      - name: Upload regen diff (if present)
        if: steps.regen_ci_reqs.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regen-pins-diff
          path: /tmp/regen_diff.patch

      - name: Compute top-5 package-change summary
        if: steps.regen_ci_reqs.outputs.changed == 'true'
        run: |
          python scripts/regen_summary.py /tmp/regen_diff.patch regen_summary.txt

      - name: Write the report to the job summary
        # The report goes to the job summary rather than a pull request comment. Upstream releases move
        # often enough that the regeneration nearly always finds drift, so a comment landed on almost
        # every pull request and mailed every subscriber about something nobody acts on: this workflow
        # only reports, and the scheduled regen workflow opens the pin-update pull request itself.
        env:
          CHANGED: ${{ steps.regen_ci_reqs.outputs.changed }}
        run: |
          {
            echo "## regen-ci-req-report"
            echo
            if [ "$CHANGED" = "true" ]; then
              echo "Regenerating the CI pins on this ref changes them. The patch is uploaded as the \`regen-pins-diff\` artifact."
              echo
              if [ -s regen_summary.txt ]; then
                echo '```'
                cat regen_summary.txt
                echo
                echo '```'
                echo
              fi
              echo "This workflow only reports; the scheduled regen workflow opens the pin-update pull request."
            else
              echo "Regenerating the CI pins on this ref produces no changes: the committed pins are current."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
